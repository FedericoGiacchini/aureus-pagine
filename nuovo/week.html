                <span style="text-align: right; font-family: 'Instrument Serif', serif; font-size: 28px;">{{r.b}}</span>
              </div>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const D = window.AUREUS_WEEK;
    let w = D.week;
    try { const u = new URLSearchParams(location.search).get('w'); if (u && D.partite.some((p) => p.w === +u)) w = +u; } catch (e) {}
    if (!D.partite.some((p) => p.w === w) || w > D.week) w = D.week;
    this.state = { w, ordine: 'orario' };
  }
  vai(w) {
    try { const u = new URL(location.href); u.searchParams.set('w', w); history.replaceState(null, '', u); } catch (e) {}
    this.setState({ w });
  }
  renderVals() {
    const D = window.AUREUS_WEEK; const st = this.state; const SQ = D.squadre; const link = D.link;
    const fmt = (x, d) => (x === null || x === undefined || isNaN(x)) ? '–' : Number(x).toFixed(d === undefined ? 1 : d).replace('.', ',').replace('-', '−');
    const segno = (x, d) => (x > 0 ? '+' : '') + fmt(x, d);
    const nick = (t) => (SQ[t] && SQ[t].nome) || t;
    const tz = { timeZone: 'Europe/Rome' };
    const quando = (d) => d.toLocaleDateString('it-IT', Object.assign({ weekday: 'short', day: 'numeric', month: 'short' }, tz)).replace(/\./g, '') + ' · ' + d.toLocaleTimeString('it-IT', Object.assign({ hour: '2-digit', minute: '2-digit' }, tz));
    const badge = (t) => 'display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-family: \'JetBrains Mono\', monospace; font-size: 10px; font-weight: 700; color: #FFFFFF; background: ' + ((SQ[t] && SQ[t].col) || '#56636b') + '; box-shadow: inset 0 0 0 2px ' + ((SQ[t] && SQ[t].col2) || '#9aa7ad') + ';';
    const pill = (on) => 'cursor: pointer; padding: 8px 14px; border-radius: 999px; font: 13px \'JetBrains Mono\', monospace; ' + (on ? 'background: #FFFFFF; color: #04060D; border: 1px solid #FFFFFF; font-weight: 600;' : 'background: transparent; color: #C9D0E2; border: 1px solid rgba(255,255,255,0.22);');
    // solo le week fino a quella da giocare: piu' avanti non ci sono ancora previsioni
    const tutteW = [...new Set(D.partite.map((p) => p.w))].filter((x) => x <= D.week).sort((a, b) => a - b);
    const weeks = tutteW.map((x) => ({ nome: String(x), on: String(x === st.w), aria: 'Week ' + x, style: pill(x === st.w), pick: () => this.vai(x) }));
    const P = D.partite.filter((p) => p.w === st.w).map((p) => Object.assign({}, p, { koD: new Date(String(p.ko).replace(' ', 'T').replace(/\+(\d\d)$/, '+$1:00')) }));
    const giocate = P.filter((p) => p.fin && p.pw != null);
    // riepilogo (regole fissate prima di guardare, pagina_week.py)
    let riep = [], notaRiep = '', sottoTit = '';
    const grande = 'font-size: 42px;', medio = 'font-size: 28px;';
    if (giocate.length) {
      const dec = giocate.filter((p) => p.fin[1] !== p.fin[0]);
      const giusti = dec.filter((p) => (p.pw > 0.5) === (p.fin[1] > p.fin[0])).length;
      const brier = dec.reduce((a, p) => a + Math.pow(p.pw - (p.fin[1] > p.fin[0] ? 1 : 0), 2), 0) / Math.max(1, dec.length);
      const eM = giocate.reduce((a, p) => a + Math.abs((p.ph - p.pa) - (p.fin[1] - p.fin[0])), 0) / giocate.length;
      const eT = giocate.reduce((a, p) => a + Math.abs((p.ph + p.pa) - (p.fin[1] + p.fin[0])), 0) / giocate.length;
      const conM = giocate.filter((p) => p.ml != null); let mod = 0, mer = 0;
      conM.forEach((p) => { const r = p.fin[1] - p.fin[0]; const a = Math.abs(r - (p.ph - p.pa)); const b = Math.abs(r - p.ml); if (a < b) mod++; else if (b < a) mer++; });
      riep = [
        { tit: 'VINCITORI INDOVINATI', vStyle: grande, v: giusti + '/' + dec.length, nota: Math.round(100 * giusti / Math.max(1, dec.length)) + '% delle partite' + (dec.length < giocate.length ? ' (pareggi esclusi)' : '') + '.' },
        { tit: 'BRIER', vStyle: grande, v: fmt(brier, 3), nota: 'Più basso è meglio: 0,25 è una moneta, 0 indovinare tutto al 100%.' },
        { tit: 'ERRORE MEDIO', vStyle: grande, v: fmt(eM) + ' pt', nota: 'sul margine; ' + fmt(eT) + ' punti sul totale della partita.' },
        { tit: 'MODELLO O MERCATO', vStyle: grande, v: mod + ' – ' + mer, nota: 'Partite in cui il modello è stato più vicino del mercato al margine reale, e il contrario' + (conM.length - mod - mer ? ' (' + (conM.length - mod - mer) + ' pari)' : '') + '.' }
      ];
      sottoTit = giocate.length === P.length ? 'com’è andata' : 'in corso';
      notaRiep = (giocate.length < P.length ? giocate.length + ' partite giocate su ' + P.length + '. ' : '') + 'Previsioni del modello sul sito (' + D.versione + ') fatte prima del kickoff; mercato = linea di chiusura (nflverse).';
    } else if (P.length) {
      const prev = P.filter((p) => p.pw != null);
      const incerta = prev.slice().sort((a, b) => Math.abs(a.pw - 0.5) - Math.abs(b.pw - 0.5))[0];
      const netta = prev.slice().sort((a, b) => Math.abs(b.ph - b.pa) - Math.abs(a.ph - a.pa))[0];
      const spara = prev.slice().sort((a, b) => (b.ph + b.pa) - (a.ph + a.pa))[0];
      const fav = (p) => p.pw >= 0.5 ? p.casa : p.osp;
      riep = [{ tit: 'PARTITE', vStyle: grande, v: String(P.length), nota: 'da giocare in questa week.' }].concat(prev.length ? [
        { tit: 'LA PIÙ INCERTA', vStyle: medio, v: nick(incerta.osp) + ' @ ' + nick(incerta.casa), nota: nick(fav(incerta)) + ' al ' + Math.round(100 * Math.max(incerta.pw, 1 - incerta.pw)) + '%.' },
        { tit: 'LA PIÙ NETTA', vStyle: medio, v: nick(netta.osp) + ' @ ' + nick(netta.casa), nota: nick(fav(netta)) + ' di ' + fmt(Math.abs(netta.ph - netta.pa)) + ' punti.' },
        { tit: 'LA PIÙ SPETTACOLARE', vStyle: medio, v: nick(spara.osp) + ' @ ' + nick(spara.casa), nota: fmt(spara.ph + spara.pa) + ' punti attesi in totale.' }] : []);
      sottoTit = 'da giocare';
      notaRiep = prev.length ? 'Previsioni del modello sul sito (' + D.versione + '); si aggiornano fino al kickoff.' : 'Previsioni non ancora pronte.';
    }
    // le partite
    const errore = (p) => p.fin && p.pw != null ? Math.abs((p.ph - p.pa) - (p.fin[1] - p.fin[0])) : -1;
    const ord = st.ordine === 'errore' ? P.slice().sort((a, b) => errore(b) - errore(a)) : P.slice().sort((a, b) => a.koD - b.koD);
    const ordini = [['orario', 'Per orario'], ['errore', 'Errore più grande']].filter(([k]) => k === 'orario' || giocate.length)
      .map(([k, n]) => ({ nome: n, on: String(st.ordine === k), pick: () => this.setState({ ordine: k }), style: 'border: 0; cursor: pointer; padding: 7px 12px; border-radius: 999px; font: inherit; ' + (st.ordine === k ? 'background: #FFFFFF; color: #04060D;' : 'background: transparent; color: #C9D0E2;') }));
    const carte = ord.map((g) => {
      const ha = g.pw != null; const fav = ha ? (g.pw >= 0.5 ? g.casa : g.osp) : null;
      const vinc = g.fin ? (g.fin[1] > g.fin[0] ? g.casa : g.fin[1] < g.fin[0] ? g.osp : null) : null;
      const riga = (t, isCasa) => ({ ab: t, badge: badge(t), logo: (SQ[t] && SQ[t].logo) || '', haLogo: !!(SQ[t] && SQ[t].logo), nome: nick(t),
        a: g.fin ? (ha ? fmt(isCasa ? g.ph : g.pa) : '–') : (ha ? Math.round(100 * (isCasa ? g.pw : 1 - g.pw)) + '%' : ''),
        b: g.fin ? String(isCasa ? g.fin[1] : g.fin[0]) : (ha ? fmt(isCasa ? g.ph : g.pa) : '–'),
        nomeStyle: g.fin ? (vinc === t ? 'color: #FFFFFF;' : 'color: #8F9BB8; font-weight: 500;') : (fav === t ? 'color: #FFFFFF;' : 'color: #C9D0E2; font-weight: 500;') });
      const colA = (SQ[g.osp] && SQ[g.osp].col) || '#56636b'; const colH = (SQ[g.casa] && SQ[g.casa].col) || '#56636b';
      const pw = ha ? g.pw : 0.5;
      const giusto = g.fin && ha && vinc ? (g.pw > 0.5) === (vinc === g.casa) : null;
      const mFav = g.ml == null ? null : g.ml > 0 ? g.casa : g.ml < 0 ? g.osp : null;
      const mercato = g.ml == null ? '' : 'Mercato: ' + (mFav ? nick(mFav) + ' favoriti di ' + fmt(Math.abs(g.ml)) : 'alla pari') + (g.mt != null ? ' · totale ' + fmt(g.mt) : '') + (g.fin ? '' : ' (ultima linea)');
      let aut = '', autStyle = '', msf = '';
      if (g.fin && g.vm != null && vinc) {
        const vmV = vinc === g.casa ? g.vm : 1 - g.vm;
        aut = 'vittoria ' + (vmV >= 0.7 ? 'meritata' : vmV >= 0.3 ? 'in bilico' : 'fortunata');
        autStyle = 'padding: 4px 9px; border-radius: 999px; ' + (vmV >= 0.7 ? 'background: rgba(61,220,151,0.18); color: #9FF0C8;' : vmV >= 0.3 ? 'background: rgba(255,210,122,0.18); color: #FFE2A8;' : 'background: rgba(255,110,110,0.18); color: #FFB3B3;');
        const m = vinc === g.casa ? g.msf : -g.msf;
        msf = 'senza fortuna ' + nick(vinc) + ' ' + segno(m, 1);
      }
      return {
        aria: nick(g.osp) + ' a ' + nick(g.casa) + (g.href ? ': apri la partita' : ''), href: g.href || '#',
        quando: quando(g.koD), stato: g.fin ? 'FINALE' : 'DA GIOCARE',
        statoStyle: 'padding: 3px 8px; border-radius: 999px; ' + (g.fin ? 'background: rgba(255,255,255,0.14); color: #FFFFFF;' : 'border: 1px solid rgba(255,255,255,0.2);'),
        colA: g.fin ? 'PREVISTO' : 'VITTORIA', colB: g.fin ? 'REALE' : 'PREVISTO',
        righe: [riga(g.osp, false), riga(g.casa, true)],
        barA: 'display: block; width: ' + (100 * (1 - pw)).toFixed(1) + '%; background: ' + colA + ';', barH: 'display: block; flex: 1 1 auto; background: ' + colH + ';',
        nota: !ha ? 'Previsione non ancora pronta' : nick(fav) + ' al ' + Math.round(100 * Math.max(g.pw, 1 - g.pw)) + '%' + (g.fin ? ' · scarto sul margine ' + fmt(errore(g)) : ''),
        esito: giusto === null ? '' : giusto ? '✓ vincitore' : '✗ vincitore', esitoStyle: giusto ? 'color: #FFB27A;' : 'color: #8FC1FF;',
        mercato, haAut: aut ? 'true' : '', aut, autStyle, msf,
        apri: g.href ? 'Apri la partita →' : 'Pagina della partita non ancora pronta', apriCol: g.href ? '#FFD9B8' : '#6F7A94',
        style: 'display: block; text-decoration: none; color: #FFFFFF; border-radius: 24px; padding: 18px 20px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(6px);' + (g.href ? '' : ' pointer-events: none;')
      };
    });
    return {
      link, w: st.w, weeks, riep, notaRiep, sottoTit, ordini, carte,
      sopra: 'STAGIONE ' + D.stagione + ' · ' + P.length + ' PARTITE',
      legenda: 'Vittoria meritata, in bilico o fortunata: quante volte su 100 la squadra avrebbe vinto giocando così, con fumble, intercetti e calci ripescati a caso (meritata da 70, fortunata sotto 30). “Senza fortuna” è il margine togliendo quella fortuna. Orari italiani.'
    };
  }
}

var c = AureusMonta(document.getElementById('modello'), Component, document.getElementById('app'), {});
</script>
