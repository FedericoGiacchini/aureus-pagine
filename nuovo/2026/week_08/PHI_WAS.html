<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUREUS · PHI @ WAS</title>

<link rel="icon" href="../../logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#04060D}
a{color:#FFFFFF}a:hover{color:#FFD9B8}
.aur-corsia{transition:background 260ms ease, transform 260ms ease}
.aur-barra{transition:height 600ms cubic-bezier(.2,.8,.2,1), background 260ms ease}
.aur-corsia:hover{transform:translateY(-3px)}
@keyframes aurFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aur-entra{animation:aurFade 420ms ease both}
#app{position:relative;z-index:1}
#aur-sfondo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#04060D}
#aur-sfondo .aur-g{position:absolute;width:95vmax;height:95vmax;transition:opacity 1.8s ease,transform 1.8s ease}
#aur-sfondo .aur-g1{left:-30vmax;top:-50vmax}
#aur-sfondo .aur-g2{right:-30vmax;top:-42vmax}
#aur-sfondo .aur-r{width:100%;height:100%;border-radius:50%;transition:background 1.8s ease;animation:aurRespiro 40s ease-in-out infinite alternate}
#aur-sfondo .aur-g2 .aur-r{animation-delay:-20s}
#aur-sfondo .aur-blu{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 0% 100%,rgba(40,90,255,0.20) 0%,rgba(4,6,13,0) 70%),radial-gradient(ellipse 50% 40% at 100% 85%,rgba(255,140,80,0.10) 0%,rgba(4,6,13,0) 70%)}
#aur-sfondo .aur-righe{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,rgba(255,255,255,0) 1px,rgba(255,255,255,0) 7px)}
@keyframes aurRespiro{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,3vmax) scale(1.07)}100%{transform:translate(-3vmax,5vmax) scale(0.95)}}
@media (prefers-reduced-motion: reduce){#aur-sfondo .aur-r{animation:none}#aur-sfondo .aur-g,#aur-sfondo .aur-r{transition:none}}
</style>

</head>
<body>
<div id="app"></div>
<template id="modello">
<div style="position: relative; z-index: 1; min-height: 100%; color: #F2F4FA; font-family: 'Inter', system-ui, sans-serif;">

  <div style="position: relative; max-width: 1240px; margin: 0 auto; padding: 0 24px 80px;">

    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 22px 0;">
      <a href="{{link.home}}" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF;">
        <img src="../../logo/aureus_piccolo.svg" alt="" width="40" height="40" style="display: block;">
        <span style="font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 0.22em;">AUREUS</span>
      </a>
      <nav aria-label="Sezioni della partita" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; flex: 1 1 auto; font-family: 'JetBrains Mono', monospace; font-size: 13px;">
        <sc-for list="{{pagine}}" as="p" hint-placeholder-count="5"><button type="button" onClick="{{p.pick}}" aria-current="{{p.cur}}" style="{{p.style}}"><span style="{{p.dot}}">●</span> {{p.nome}}</button></sc-for>
      </nav>
      <a href="{{link.week}}" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; text-decoration: none; color: #FFFFFF; padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25);">← {{testa.weekLab}}</a>
    </header>

    <sc-if value="{{noStoria}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 18px auto 0; max-width: 620px; padding: 14px 28px 16px; border-radius: 26px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); text-align: center;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #C9D0E2;">{{testa.barraSu}}</span>
        <span style="font-family: 'Instrument Serif', serif; font-size: 30px; line-height: 1.1;">{{testa.barraPunti}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #E6EAF3;">{{testa.barraProb}}</span>
      </div>
    </sc-if>
    <sc-if value="{{isStoria}}" hint-placeholder-val="{{ true }}">
    <section aria-label="La partita" style="text-align: center; padding: 40px 0 10px;">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #C9D0E2; letter-spacing: 0.08em;">{{testa.sopra}}</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; margin-top: 28px;">
        <sc-for list="{{testa.lati}}" as="q" hint-placeholder-count="2">
        <div style="{{q.ordine}} display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <span style="{{q.badge}}">{{q.ab}}<sc-if value="{{q.haLogo}}" hint-placeholder-val="{{ false }}"><img src="{{q.logo}}" alt="" onerror="this.remove()" style="position: absolute; inset: 6px; width: 62px; height: 62px; object-fit: contain; background: #FFFFFF; border-radius: 50%;"></sc-if></span>
          <span style="font-family: 'Instrument Serif', serif; font-size: 34px;">{{q.nome}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #AEB7CC;">{{q.sotto}}</span>
        </div>
        </sc-for>
        <div style="order: 2;">
          <div style="font-family: 'Instrument Serif', serif; font-size: 120px; line-height: 0.9; letter-spacing: -0.02em;">{{testa.pa1}}<span style="font-size: 64px; color: #AEB7CC;">{{testa.pa2}}</span> <span style="color: #6F7C99; font-size: 70px;">–</span> {{testa.ph1}}<span style="font-size: 64px; color: #AEB7CC;">{{testa.ph2}}</span></div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #C9D0E2; margin-top: 10px;">{{testa.sottoPunti}}</div>
        </div>
      </div>
      <div style="max-width: 760px; margin: 30px auto 0;">
        <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 13px;"><span>{{testa.probA}}</span><span>{{testa.probH}}</span></div>
        <div style="display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 3px; margin-top: 8px;"><span style="{{testa.barA}}"></span><span style="flex: 1 1 auto; background: {{glow}};"></span></div>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px;">
          <sc-for list="{{testa.pill}}" as="t" hint-placeholder-count="2"><span style="padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);">{{t.t}}</span></sc-for>
        </div>
      </div>
    </section>
    </sc-if>

    <sc-if value="{{pag_storia}}" hint-placeholder-val="{{ true }}">
    <section id="storia" aria-label="La storia del match" style="margin-top: 40px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px;">
      <div style="grid-column: span 7;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #E6EAF3;">● La storia</span>
        <h2 style="margin: 12px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 54px; line-height: 1.02;">{{storia.tit}}</h2>
        <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 14px; font-size: 17px; line-height: 1.6; color: #D8DDEA;">
          <sc-for list="{{storia.par}}" as="p" hint-placeholder-count="3"><p style="margin: 0;">{{p.t}}</p></sc-for>
        </div>
        <div style="margin-top: 28px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #AEB7CC;">INJURY REPORT · fuori, improbabili, in dubbio e inattivi, con le notizie prima del kickoff</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 10px; align-items: start;">
          <sc-for list="{{storia.inj}}" as="tb" hint-placeholder-count="2">
            <div style="border-radius: 20px; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);">
              <div style="display: flex; align-items: center; gap: 8px;"><sc-if value="{{tb.haLogo}}" hint-placeholder-val="{{ false }}"><img src="{{tb.logo}}" alt="" style="width: 24px; height: 24px; object-fit: contain;"></sc-if><span style="font-family: 'Instrument Serif', serif; font-size: 22px;">{{tb.nome}}</span></div>
              <sc-for list="{{tb.righe}}" as="r" hint-placeholder-count="3"><div style="padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.08); font-size: 14px; line-height: 1.4;"><div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline;"><b>{{r.nome}} <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 400; color: #AEB7CC;">{{r.pos}}</span></b><span style="{{r.style}}">{{r.stato}}</span></div><div style="font-size: 12.5px; color: #C9D0E2;">{{r.tit}}</div><div style="font-size: 12.5px; color: #C9D0E2;">{{r.sost}}</div></div></sc-for>
              <div style="font-size: 13px; color: #C9D0E2;">{{tb.vuoto}}</div>
              <div style="font-size: 12.5px; line-height: 1.45; color: #AEB7CC; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08);">{{tb.altri}}</div>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="grid-column: span 5; display: flex; flex-direction: column; gap: 12px; padding-top: 34px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #AEB7CC;">I FATTORI CHE PESANO DI PIÙ · punti sul margine</span>
        <div style="border-radius: 22px; padding: 10px 20px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); display: flex; flex-direction: column;">
          <sc-for list="{{fattori}}" as="f" hint-placeholder-count="5">
            <div style="padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">
              <button type="button" onClick="{{f.pick}}" aria-expanded="{{f.on}}" style="width: 100%; border: 0; background: transparent; color: #FFFFFF; cursor: pointer; padding: 0; font: inherit; text-align: left;">
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; gap: 10px;"><span><span style="display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35); font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-right: 8px;">{{f.freccia}}</span>{{f.nome}}</span><b>{{f.eff}}</b></div>
                <div style="height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); margin-top: 7px;"><div class="aur-barra" style="{{f.barStyle}}"></div></div>
              </button>
              <sc-if value="{{f.aperto}}" hint-placeholder-val="{{ false }}">
                <div class="aur-entra" style="margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: rgba(4,6,13,0.45); font-size: 13.5px; line-height: 1.55; color: #E6EAF3;">
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #AEB7CC;">CHE COSA MISURA</div><div style="margin-top: 3px;">{{f.cosa}}</div>
                  <div style="display: flex; gap: 14px; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px;"><span>{{nomi.casa}} {{f.kc}}</span><span>{{nomi.osp}} {{f.lac}}</span><span style="color: #AEB7CC;">punti attesi di squadra</span></div>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #AEB7CC; margin-top: 10px;">IN QUESTA PARTITA</div><div style="margin-top: 3px;">{{f.qui}}</div>
                </div>
              </sc-if>
            </div>
          </sc-for>
          <p style="margin: 10px 0 4px; font-size: 12.5px; line-height: 1.5; color: #AEB7CC;">Come leggerli: ogni fattore sposta i punti attesi di ciascuna squadra; la differenza tra le due è l’effetto sul margine, dal punto di vista dei {{nomi.casa}} (positivo = a loro favore). {{fattNota}}</p>
        </div>
      </div>
    </section>
    </sc-if>

    <sc-if value="{{pag_campo}}" hint-placeholder-val="{{ false }}">
    <section id="campo" aria-label="Le squadre in campo" style="margin-top: 40px;">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;">
        <div>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #E6EAF3;">● In campo</span>
          <h2 style="margin: 10px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 48px; line-height: 1;">{{campo.titolo}} <span style="font-style: italic; color: #AEB7CC;">{{campo.sotto}}</span></h2>
        </div>
        <div role="group" aria-label="Chi attacca" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); font-family: 'JetBrains Mono', monospace; font-size: 13px;">
          <sc-for list="{{campoSq}}" as="q" hint-placeholder-count="2"><button type="button" onClick="{{q.pick}}" aria-pressed="{{q.on}}" style="{{q.style}}">{{q.nome}}</button></sc-for>
        </div>
      </div>
      <div style="position: relative; margin-top: 22px; height: 800px; border-radius: 32px; overflow: hidden; background: linear-gradient(180deg, #0E2A1E 0%, #12392A 48%, #164A35 52%, #0F3324 100%); border: 1px solid rgba(140,255,190,0.20); box-shadow: inset 0 0 120px rgba(0,0,0,0.55);">
        <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(255,255,255,0.07) 0px, rgba(255,255,255,0.07) 2px, rgba(255,255,255,0) 2px, rgba(255,255,255,0) 92px);"></div>
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 402px; background: {{campo.alone}};"></div>
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 404px; height: 3px; background: {{glow}}; box-shadow: 0 0 24px {{glow}};"></div>
        <span style="position: absolute; left: 22px; top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #CFE3D7; letter-spacing: 0.08em;">{{campo.etDif}}</span>
        <span style="position: absolute; left: 22px; bottom: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #CFE3D7; letter-spacing: 0.08em;">{{campo.etAtt}}</span>
        <sc-for list="{{campo.giocatori}}" as="g" hint-placeholder-count="23">
          <button type="button" onClick="{{g.pick}}" aria-label="{{g.aria}}" class="aur-corsia" style="{{g.style}} cursor: pointer; font: inherit;">
            <span style="{{g.fotoStyle}} position: relative; overflow: hidden;" aria-hidden="true">{{g.ini}}<sc-if value="{{g.haImg}}" hint-placeholder-val="{{ false }}"><img src="{{g.img}}" alt="" loading="lazy" onerror="this.remove()" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; {{g.imgBg}}"></sc-if></span>
            <span style="display: block; margin-top: 5px; font-family: 'Instrument Serif', serif; font-size: 17px; line-height: 1.05;">{{g.nome}}</span>
            <span style="display: block; margin-top: 2px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #FFFFFF; white-space: nowrap;">{{g.riga1}}</span>
            <span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #CFE3D7; white-space: nowrap;">{{g.riga2}}</span>
            <span style="display: block; margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.14); font-size: 10px; color: #AEB7CC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{g.ricambio}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">
        <span>Sotto ogni titolare: ↺ il ricambio e la sua quota di snap («riserva» se non ruota)</span>
        <span><span style="display: inline-block; width: 12px; height: 12px; border-radius: 4px; border: 2px dashed #FF8C78; vertical-align: -2px;"></span> riserva al posto di un titolare fuori</span>
        <span><span style="display: inline-block; width: 12px; height: 12px; border-radius: 4px; border: 2px solid #FFD36B; vertical-align: -2px;"></span> in dubbio</span>
        <span>Linea luminosa: la linea di scrimmage; l’attacco va verso l’alto</span>
        <span>Clic su un giocatore: si apre la sua scheda</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; align-items: start;">
        <sc-for list="{{campo.tab}}" as="tb" hint-placeholder-count="2">
          <div style="border-radius: 20px; padding: 16px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);">
            <div style="display: flex; align-items: center; gap: 10px;"><sc-if value="{{tb.haLogo}}" hint-placeholder-val="{{ false }}"><img src="{{tb.logo}}" alt="" style="width: 28px; height: 28px; object-fit: contain;"></sc-if><span style="font-family: 'Instrument Serif', serif; font-size: 24px;">{{tb.nome}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">{{tb.lato}}</span></div>
            <div style="display: grid; grid-template-columns: 52px 1.2fr 1.2fr 1.3fr; gap: 8px; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #AEB7CC;"><span>POS.</span><span>CHI GIOCA</span><span>AL POSTO DI</span><span>PERCHÉ</span></div>
            <sc-for list="{{tb.righe}}" as="r" hint-placeholder-count="3"><div style="display: grid; grid-template-columns: 52px 1.2fr 1.2fr 1.3fr; gap: 8px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.08); font-size: 13.5px; line-height: 1.35;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px;">{{r.pos}}</span><b>{{r.chi}}</b><span>{{r.posto}}</span><span style="color: #C9D0E2;">{{r.perche}}</span></div></sc-for>
            <div style="font-size: 13px; color: #C9D0E2; margin-top: 6px;">{{tb.vuoto}}</div>
          </div>
        </sc-for>
      </div>
      <p style="margin: 12px 0 0; font-size: 14px; color: #E6EAF3;">{{campo.personale}}</p>
      <p style="margin: 8px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8F9BB8;">Schieramento indicativo: posizioni e ricambi dal depth chart della week {{testa.week}}, titolari corretti con assenze e snap delle ultime due partite. Gli 11 per lato seguono il personale più usato, stimato dalle quote di snap di ogni reparto: è la formazione più frequente, non l’unica.</p>

      <sc-if value="{{pop.ha}}" hint-placeholder-val="{{ false }}">
        <div style="position: fixed; inset: 0; z-index: 50; background: rgba(4,6,13,0.72); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px;">
          <div role="dialog" aria-modal="true" aria-label="Scheda del giocatore" class="aur-entra" style="width: 100%; max-width: 780px; max-height: 88vh; overflow: auto; border-radius: 30px; padding: 26px; background: linear-gradient(160deg, #141A2B, #0B0F1C); border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 40px 120px rgba(0,0,0,0.6); color: #F2F4FA;">
            <div style="display: flex; align-items: center; gap: 16px;">
              <span style="{{pop.foto}} position: relative; overflow: hidden;" aria-hidden="true">{{pop.ini}}<sc-if value="{{pop.haImg}}" hint-placeholder-val="{{ false }}"><img src="{{pop.img}}" alt="" loading="lazy" onerror="this.remove()" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; {{pop.imgBg}}"></sc-if></span>
              <div style="flex: 1 1 auto;"><div style="font-family: 'Instrument Serif', serif; font-size: 38px; line-height: 1.05;">{{pop.nome}}</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #AEB7CC;">{{pop.sotto}}</div></div>
              <button type="button" onClick="{{pop.chiudi}}" aria-label="Chiudi" style="border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #FFFFFF; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px;">×</button>
            </div>
            <sc-if value="{{pop.haBox}}" hint-placeholder-val="{{ true }}">
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC; margin-top: 18px;">BOX SCORE PREVISTO</div>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 8px;">
                <sc-for list="{{pop.box}}" as="c" hint-placeholder-count="5"><div style="padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.06);"><div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #AEB7CC;">{{c.lab}}</div><div style="font-family: 'Instrument Serif', serif; font-size: 28px;">{{c.v}}</div></div></sc-for>
              </div>
            </sc-if>
            <sc-if value="{{pop.haFin}}" hint-placeholder-val="{{ true }}">
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px;">
                <div style="border-radius: 18px; padding: 14px 16px; background: rgba(255,178,122,0.12); border: 1px solid {{glow}};"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: {{glow}};">▲ PUNTI DI FORZA</div><sc-for list="{{pop.bene}}" as="v" hint-placeholder-count="2"><div style="margin-top: 8px; font-size: 14px; line-height: 1.45;">{{v.t}}</div></sc-for><div style="margin-top: 8px; font-size: 13px; color: #C9D0E2;">{{pop.vuotoBene}}</div></div>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const X0 = window.AUREUS_PARTITA;
    this.state = { sel: 0, reale: false, ruolo: 'RB', att: X0.casa, rb: 0, zona: 8, ric: -1, fatt: -1, dsel: -1, boxTab: 'pass', pagina: 'storia', catt: X0.casa, pop: null };
  }
  renderVals() {
    const glow = this.props.glow ?? '#FFB27A';
    const X = window.AUREUS_PARTITA;
    // classifiche per ruolo (classifiche.py): posto nella lega, punti di forza e debolezze, confronti della week
    const CL = X.clas || {}; const SETT = X.sett || {};
    // regola: prima le due classifiche piu' estreme, poi la voce piu' legata alla partita, poi il resto; al massimo 4
    const unisci = (nome, bene, male) => {
      const c = CL[nome]; const cb = c ? c.bene : []; const cm = c ? c.male : [];
      const ord = (k, a) => { const o = k.slice(0, 2).concat(a.slice(0, 1), k.slice(2), a.slice(1)); return o.filter((t, i) => o.indexOf(t) === i).slice(0, 4); };
      return { bene: ord(cb, bene), male: ord(cm, male) };
    };
    const perNota = (nome) => [CL[nome] && CL[nome].storia ? CL[nome].storia.join(' ') : '', CL[nome] && CL[nome].rientro ? CL[nome].rientro.charAt(0).toUpperCase() + CL[nome].rientro.slice(1) + '.' : '',
      CL[nome] && CL[nome].mix ? 'Classifiche e numeri ' + CL[nome].per + ': in questa stagione ha giocato poco.' : ''].filter((t) => t).join(' ');
    const CASA = X.casa; const OSP = X.osp; const DUE = [OSP, CASA];
    const NOMI = ['est. sx', 'tackle sx', 'guardia sx', 'centro', 'guardia dx', 'tackle dx', 'est. dx'];
    const LUNGHI = ['Esterno sinistro', 'Tackle sinistro', 'Guardia sinistra', 'Centro', 'Guardia destra', 'Tackle destro', 'Esterno destro'];
    const LY = X.corsie.LY;
    const LE = X.corsie.LE;
    const LN = X.corsie.LN;
    const SQ = X.sq;
    const rgba = (h, a) => { const c = (h || '#56636b').replace('#', ''); return 'rgba(' + parseInt(c.slice(0, 2), 16) + ',' + parseInt(c.slice(2, 4), 16) + ',' + parseInt(c.slice(4, 6), 16) + ',' + a + ')'; };
    const fmt = (x, d) => (x === null || x === undefined || isNaN(x)) ? '–' : x.toFixed(d === undefined ? 1 : d).replace('.', ',').replace('-', '−');
    const fsg = (x) => (x === null || x === undefined) ? '–' : (x > 0 ? '+' : '') + fmt(x, 2);
    const att = this.state.att;
    const T = SQ[att];
    const D = SQ[T.avv];
    const rbi = Math.min(this.state.rb, T.rb.length - 1);
    const R = T.rb[rbi];
    const sel = this.state.sel;
    const colRank = (r) => r >= 25 ? 'rgba(255,120,80,0.55)' : (r >= 17 ? 'rgba(255,200,120,0.30)' : (r >= 9 ? 'rgba(140,190,255,0.22)' : 'rgba(80,140,255,0.45)'));
    const edgeOf = (i) => {
      const [n, , e] = R.l[i];
      const rbS = n ? (n * e + 15 * LE[i]) / (n + 15) : LE[i];
      return (rbS - LE[i]) + (T.dif.es[i] - LE[i]);
    };
    const verd = (e) => e > 0.25 ? 'Grande vantaggio ' + T.nome : (e > 0.05 ? 'Vantaggio ' + T.nome : (e < -0.30 ? 'Grande vantaggio difesa' : (e < -0.15 ? 'Vantaggio difesa' : 'Equilibrio')));
    const cardOf = (e) => 'border-radius: 28px; padding: 24px; transition: background 300ms ease; ' + (e > 0.25 ? 'background: ' + glow + '; color: #1A0E08; box-shadow: 0 0 60px rgba(255,160,100,0.45);' : (e > 0.05 ? 'background: #FFD3B3; color: #1A0E08;' : (e < -0.15 ? 'background: #2B5BD7; color: #FFFFFF; box-shadow: 0 0 60px rgba(60,110,255,0.45);' : 'background: #E9EDF6; color: #04060D;')));
    // colore del duello della corsia (punto 27): arancio forte = grande vantaggio RB, blu = vantaggio difesa
    const colEdge = (e) => e > 0.25 ? glow : (e > 0.05 ? '#FFD3B3' : (e < -0.30 ? '#2B5BD7' : (e < -0.15 ? '#AFC6F5' : '#E9EDF6')));
    const corsie = NOMI.map((nome, i) => {
      const [n, y] = R.l[i];
      const q = R.tot ? 100 * n / R.tot : 0;
      const on = i === sel;
      const sopra = y !== null && y > LY[i];
      return {
        nome, rank: T.dif.rank[i], dypc: fmt(T.dif.ys[i]), quota: Math.round(q) + '%', ypc: fmt(y), n, on: on ? 'true' : 'false',
        aria: LUNGHI[i] + ': ' + fmt(y) + ' yard a corsa su ' + n + ' corse',
        difStyle: 'border-radius: 14px; padding: 10px 6px; text-align: center; background: ' + colRank(T.dif.rank[i]) + ';' + (on ? ' box-shadow: 0 0 0 2px #FFFFFF;' : ''),
        barStyle: 'display: block; width: 70%; border-radius: 10px 10px 4px 4px; height: ' + Math.round(14 + q * 4.2) + 'px; background: ' + colEdge(edgeOf(i)) + ';' + (on ? ' box-shadow: 0 0 0 3px #FFFFFF, 0 0 24px rgba(255,255,255,0.35);' : ''),
        ypcStyle: 'width: 100%; border: 0; cursor: pointer; border-radius: 14px; padding: 10px 4px; font: inherit; ' + (sopra ? 'background: rgba(255,178,122,0.22); color: ' + glow + ';' : 'background: rgba(76,155,255,0.18); color: #BFD9FF;') + (on ? ' box-shadow: 0 0 0 3px #FFFFFF; transform: translateY(-3px);' : ''),
        pick: () => this.setState({ sel: i })
      };
    });
    const pos = ['TE1', 'LT', 'LG', 'C', 'RG', 'RT', 'TE2'];
    const lineaCampo = pos.map((p) => ({
      pos: p.indexOf('TE') === 0 ? 'TE' : p, nome: T.linea[p],
      style: 'padding: 6px 2px; border-radius: 10px; ' + (p.indexOf('TE') === 0 ? 'color: #A9C9B6;' : 'background: rgba(255,255,255,0.10);' + (T.assenti.indexOf(p) >= 0 ? ' border: 1px dashed rgba(255,140,120,0.9);' : ''))
    }));
    const GAP = [['LT', 'TE'], ['LT', 'LG'], ['LG', 'C'], ['C'], ['C', 'RG'], ['RG', 'RT'], ['RT', 'TE']];
    const e = edgeOf(sel);
    const [sn, sy, se, ssr] = R.l[sel];
    const selObj = {
      nomeLungo: LUNGHI[sel], rbNome: R.nome.toUpperCase(), difNome: D.breve + ' CONCEDONO',
      ypc: fmt(sy), dettRb: sn + ' corse · EPA ' + fsg(se) + (ssr === null ? '' : ' · ' + ssr + '% riuscite'),
      dypc: fmt(T.dif.ys[sel]), rank: T.dif.rank[sel], depa: fsg(T.dif.es[sel]), lypc: fmt(LY[sel]),
      linea: GAP[sel].map((g) => T.pieni[g]).join(' e ') + '.',
      verdetto: verd(e), cardStyle: cardOf(e)
    };
    // la sua partita sulle corse (punto 27): A dove corre di piu', B dove la difesa concede di piu', C fuori da A dove
    // rende meglio (almeno 5 corse); verdetto sul vantaggio medio pesato dalle sue quote (regola fissa: oltre +0,5 yard
    // a corsa sulla media = buone chance, sotto -0,3 = partita difficile)
    const rbp = (() => {
      const I = [0, 1, 2, 3, 4, 5, 6];
      const A = I.slice().sort((a, b) => R.l[b][0] - R.l[a][0]).slice(0, 3).filter((i) => R.l[i][0] > 0);
      const Bc = I.slice().sort((a, b) => T.dif.rank[b] - T.dif.rank[a]).slice(0, 3);
      const C = I.filter((i) => A.indexOf(i) < 0 && R.l[i][0] >= 5 && R.l[i][1] !== null).sort((a, b) => R.l[b][1] - R.l[a][1]).slice(0, 3);
      const exDiff = (i) => { const [n, y] = R.l[i]; const nD = T.dif.n[i]; return (y === null ? 0 : n / (n + 30) * (y - LY[i])) + nD / (nD + 30) * (T.dif.ys[i] - LY[i]); };
      const tot = I.reduce((a, i) => a + R.l[i][0], 0);
      const v = tot ? I.reduce((a, i) => a + R.l[i][0] * exDiff(i), 0) / tot : I.reduce((a, i) => a + exDiff(i), 0) / 7;
      const verdetto = v > 0.5 ? 'Buone chance' : (v < -0.3 ? 'Partita difficile' : 'Nella media');
      const vStyle = 'padding: 5px 10px; border-radius: 999px; font-family: \'JetBrains Mono\', monospace; font-size: 11px; font-weight: 700; ' + (v > 0.5 ? 'background: ' + glow + '; color: #1A0E08;' : (v < -0.3 ? 'background: #2B5BD7; color: #FFFFFF;' : 'background: #E9EDF6; color: #04060D;'));
      const usate = I.filter((i) => A.indexOf(i) >= 0 || Bc.indexOf(i) >= 0 || C.indexOf(i) >= 0);
      const righe = usate.map((i) => ({ i, k: (A.indexOf(i) >= 0) + (Bc.indexOf(i) >= 0) + (C.indexOf(i) >= 0) })).sort((a, b) => b.k - a.k || R.l[b.i][0] - R.l[a.i][0]).slice(0, 4).map(({ i }) => ({
        nome: LUNGHI[i] + ':',
        perche: [A.indexOf(i) >= 0 ? 'dove corre di più (' + Math.round(100 * R.l[i][0] / Math.max(1, tot)) + '% delle sue corse)' : '',
          Bc.indexOf(i) >= 0 ? 'dove i ' + D.nome + ' sono più deboli (' + T.dif.rank[i] + '° su 32)' : '',
          C.indexOf(i) >= 0 ? 'dove rende meglio (' + fmt(R.l[i][1]) + ' yard a corsa su ' + R.l[i][0] + ')' : ''].filter((t) => t).join(' e ') + '.' }));

        testo: 'Ogni pressione gli costa ' + fmt(Q.clean_epa - Q.press_epa, 2) + ' EPA' + (Q.clean_epa - Q.press_epa > 1 ? ': crolla.' : ': regge meglio della media.'), buono: Q.clean_epa - Q.press_epa < 0.9 }
    ].map((k, i, a) => Object.assign({}, k, {
      style: 'flex: 1 1 auto; border-radius: 22px; padding: 18px; color: #FFFFFF; ' + (k.buono ? BUONO : CATTIVO),
      frecciaStyle: 'display: grid; place-items: center; flex: 0 0 26px; font-size: 20px; color: #AEB7CC;' + (i === a.length - 1 ? ' visibility: hidden;' : '')
    }));
    const qVer = costo > 0.2 ? 'LA CATENA SI SPEZZA' : (costo > 0.12 ? 'CATENA SOTTO TENSIONE' : 'LA CATENA REGGE');
    const qb = {
      nome: Q.nome, nomeMaiusc: Q.nome.toUpperCase(), difBreve: D.breve, righe: qbRighe,
      prev: { py: fmt(Q.prev.pass_yards, 0), td: fmt(Q.prev.pass_td), int: fmt(Q.prev.interceptions) },
      reale: Q.reale.pass_yards + ' yard, ' + Q.reale.pass_td + ' TD, ' + Q.reale.interceptions + ' intercetti. Pressione subita: ' + fmt(REALE_PR[att]) + '% dei dropback (attesa ≈ ' + fmt(P, 0) + '%).',
      catena: catenaQB, verdetto: qVer,
      verdettoTesto: 'Con la pressione attesa ' + breveNome(Q.nome) + ' vale circa ' + fsg(epaAtt) + ' EPA per dropback (stagione ' + fsg(Q.epa) + ', ' + Q.r_epa + '° nella lega): la pressione gli toglie ' + fmt(costo, 2) + ' a dropback.',
      verdettoStyle: costo > 0.2 ? 'background: #2B5BD7; color: #FFFFFF; box-shadow: 0 0 50px rgba(60,110,255,0.4);' : (costo > 0.12 ? 'background: #FFD3B3; color: #1A0E08;' : 'background: ' + glow + '; color: #1A0E08;'),
      chip: [
        { tit: 'TEMPO PER LANCIARE', val: fmt(Q.tt, 2) + ' s', sub: Q.r_tt + '° nella lega · aDOT ' + fmt(Q.adot) + ' yd' },
        { tit: 'CONTRO IL BLITZ', val: fsg(Q.blitz_epa), sub: 'senza blitz ' + fsg(Q.noblitz_epa) + ' · i ' + D.nome + ' blitzano ' + ilP(Q.opp_blitz) },
        { tit: 'PLAY ACTION', val: pct(Q.pa_q), sub: 'dei dropback · EPA ' + fsg(Q.pa_epa) + ' contro ' + fsg(Q.nopa_epa) },
        { tit: 'LANCI CON IL DIFENSORE ADDOSSO', val: fmt(Q.ag) + '%', sub: 'difensore a meno di una yard (NGS) · CPOE ' + sg1(Q.cpoe) }
      ]
    };

    // ---------------- ricevitori (WR e TE)
    const gruppo = ruolo === 'TE' ? RE.te : RE.wr;
    const G = GIOC[att];
    // fuori: nell'injury report, oppure il modello ha le previsioni della partita e gli da' 0 target (senza previsioni non si dice)
    const fuoriDi = (r) => r.stato === 'Out' || (X.prev_gioc !== false && !(r.prev && r.prev.targets > 0));
    let ri = this.state.ric;
    if (ri < 0 || ri >= gruppo.length) ri = Math.max(0, gruppo.findIndex((r) => !fuoriDi(r)));
    const Rr = gruppo[ri];
    const rFuori = fuoriDi(Rr);
    const tutti = RE.wr.concat(RE.te);
    const eredi = tutti.filter((x) => !fuoriDi(x)).map((x) => [x, x.prev.targets - x.tg / G]).filter((x) => x[1] > 0.3).sort((a, b) => b[1] - a[1]);
    const maxZ = Math.max(1, ...Rr.zone.map((z) => z.n));
    const dq = Rr.q_press - Rr.q_clean;
    const quotaAtt = P / 100 * Rr.q_press + (1 - P / 100) * Rr.q_clean;
    let cTit; let cTxt;
    const frasePress = dq >= 6 ? 'Quando la tasca si chiude ' + breveNome(Q.nome) + ' lo cerca di più: ' + pct(Rr.q_press) + ' dei target sotto pressione contro ' + pct(Rr.q_clean) + ' a tasca pulita.'
      : (dq <= -6 ? 'Sotto pressione riceve ' + ilP(Rr.q_press) + ' dei target contro ' + ilP(Rr.q_clean) + ' a tasca pulita: quando arriva la pass rush il pallone va altrove.'
        : 'La pressione cambia poco la sua quota di target (' + pct(Rr.q_press) + ' sotto pressione, ' + pct(Rr.q_clean) + ' a tasca pulita).');
    if (Rr.adot >= 12) {
      cTit = 'Ha bisogno di tempo';
      cTxt = 'Con una profondità media di ' + fmt(Rr.adot) + ' yard le sue tracce si aprono tardi. ' + breveNome(Q.nome) + ' lancia in ' + fmt(Q.tt, 2) + ' secondi (' + Q.r_tt + '°); la linea concede pressione sul ' + fmt(Q.prot) + '% (' + Q.r_prot + '°) e qui ci si aspetta ≈ ' + fmt(P, 0) + '%. ' + (P > 20 ? 'Il rischio è che il pallone debba partire prima che lui sia libero. ' : 'Il tempo dovrebbe esserci. ') + frasePress;
    } else if (dq >= 6) {
      cTit = 'La valvola di sfogo';
      cTxt = frasePress + ' È la lettura rapida quando la linea cede' + (P > 20 ? ', e in questa partita la pressione attesa è alta.' : '.');
    } else if (dq <= -6) {
      cTit = 'Sparisce sotto pressione';
      cTxt = frasePress + (Rr.adot >= 9 ? ' Con ' + fmt(Rr.adot) + ' yard di profondità media, ha bisogno che la linea tenga.' : '');
    } else {
      cTit = 'Indifferente alla pressione';
      cTxt = frasePress + ' Il suo ruolo non dipende da quanto regge la linea.';
    }
    cTxt += ' Con la pressione attesa la sua quota stimata dei target è ' + pct(quotaAtt) + ' (distribuzione della stagione).';
    const dd = Rr.difensori.find((x) => x.stato !== 'Out') || Rr.difensori[0] || { nome: 'Nessun difensore', pos: '', eventi: 0, tg: null, cmp: null, ypt: null, rat: null, stato: null, det: null };
    const giudD = dd.ypt === null ? 'un difensore con pochi target' : (dd.ypt <= 6 ? 'un difensore che chiude bene' : (dd.ypt >= 9 ? 'un difensore che concede' : 'un difensore nella media'));
    const giudR = Rr.ypt >= 9.5 ? 'un ricevitore che produce' : (Rr.ypt <= 6.5 ? 'un ricevitore che fatica a produrre' : 'un ricevitore nella media');

    const ric = {
      r: Object.assign({}, Rr, { ruolo: Rr.pos === 'TE' ? 'TIGHT END' : 'RICEVITORE', ruoloBreve: breveNome(Rr.nome) }),
      perTxt: 'numeri: ' + (Rr.per || X.periodo),
      lista: gruppo.map((x, i) => {
        const f = fuoriDi(x);
        return {

          style: 'text-align: left; cursor: pointer; padding: 10px 16px; border-radius: 18px; font: inherit; color: #FFFFFF; ' + (i === ri ? 'background: rgba(255,178,122,0.22); border: 1px solid ' + glow + ';' : 'background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16);') + (f ? ' opacity: 0.65; border-style: dashed;' : ''),
          pick: () => this.setState({ ric: i })
        };
      }),
      fuori: rFuori,
      fuoriTesto: (Rr.stato === 'Out' ? 'È fuori nell’injury report.' : 'Il modello non lo dà disponibile (0 target attesi).') + ' Lascia ' + fmt(Rr.tg / G) + ' target a partita. ' + (eredi.length ? 'Chi ne guadagna secondo il modello: ' + eredi.map((x) => breveNome(x[0].nome) + ' +' + fmt(x[1])).join(', ') + ' target attesi rispetto alla sua media.' : ''),
      numeri: [
        { tit: 'TARGET', val: Rr.tg + ' · ' + pct(Rr.quota) },
        { tit: 'PROFONDITÀ MEDIA', val: fmt(Rr.adot) + ' yd' },
        { tit: 'RICEZIONI SUI TARGET', val: pct(Rr.cr) },
        { tit: 'YARD PER TARGET', val: fmt(Rr.ypt) },
        { tit: 'EPA PER TARGET', val: fsg(Rr.epa) },
        { tit: 'SEPARAZIONE (NGS)', val: Rr.sep === null ? '–' : fmt(Rr.sep) + ' yd' },
        { tit: 'YAC OLTRE L’ATTESO', val: Rr.yacx === null ? '–' : sg1(Rr.yacx) },
        { tit: 'LATO PREFERITO', val: LATON[Rr.lato_main] + ' ' + pct(Rr.lati[Rr.lato_main]) }
      ],
      righe: PROF.map(([p], r) => ({
        nome: p,
        celle: [0, 1, 2].map((c) => {
          const n = Rr.zone[r * 3 + c].n; const a = n / maxZ;
          return { n: n || '·', style: 'height: 54px; border-radius: 12px; display: grid; place-items: center; background: ' + (n ? 'rgba(255,178,122,' + (0.15 + 0.8 * a).toFixed(2) + ')' : 'rgba(255,255,255,0.05)') + '; color: ' + (a > 0.5 ? '#1A0E08' : '#FFFFFF') + ';' };
        })
      })),
      latoTesto: 'LANCI ' + verso(Rr.lato_main).toUpperCase(),
      ypt: fmt(Rr.ypt), sep: Rr.sep === null ? '–' : fmt(Rr.sep),
      d: { nome: dd.nome, pos: dd.pos, ypt: fmt(dd.ypt), cmp: dd.cmp === null ? '–' : fmt(dd.cmp, 0), rat: dd.rat === null ? '–' : fmt(dd.rat, 0) },
      duelloTesto: breveNome(dd.nome) + ' è il difensore dei ' + D.nome + ' segnato più spesso sui lanci ' + verso(Rr.lato_main) + ' (' + dd.eventi + ' volte tra deviazioni, intercetti e placcaggi). Da una parte ' + giudR + ', dall’altra ' + giudD + '.' + (dd.stato ? ' Attenzione: ' + breveNome(dd.nome) + ' è ' + (STATI[dd.stato] || dd.stato).toLowerCase() + '.' : '') + ' Probabile, non certo: chi copre chi (uomo o zona) si sa solo a fine stagione.',

      barClean: 'height: 8px; border-radius: 999px; width: ' + Math.min(100, Rr.q_clean / 30 * 100) + '%; background: #FFFFFF;',
      barPress: 'height: 8px; border-radius: 999px; width: ' + Math.min(100, Rr.q_press / 30 * 100) + '%; background: ' + (dq >= 0 ? glow : '#4C9BFF') + ';',
      prevTesto: rFuori ? '0 target: non gioca' : fmt(Rr.prev.targets) + ' target · ' + fmt(Rr.prev.receptions) + ' ricezioni · ' + fmt(Rr.prev.rec_yards, 0) + ' yard',
      realeTesto: Rr.reale.targets === null ? 'non ha giocato.' : Rr.reale.targets + ' target, ' + Rr.reale.receptions + ' ricezioni, ' + Rr.reale.rec_yards + ' yard' + (Rr.reale.rec_td ? ', ' + Rr.reale.rec_td + ' TD' : '') + '.'
    };

    // ---------------- kicker
    const KK = RE.k;
    const f0 = KK.fasce[0]; const f1 = KK.fasce[1]; const f2 = KK.fasce[2];
    const kick = {
      fasce: KK.fasce.map((f) => {
        const r = f.tentati ? f.fatti / f.tentati : null;
        return { fascia: f.fascia, testo: f.tentati ? f.fatti + ' su ' + f.tentati + ' · ' + pct(100 * r) : 'nessun tentativo',
          barStyle: 'height: 14px; border-radius: 999px; width: ' + (r === null ? 0 : Math.max(4, 100 * r)) + '%; background: ' + (r === null ? 'transparent' : (r === 1 ? glow : (r < 0.6 ? '#4C9BFF' : '#FFD3B3'))) + ';' };
      }),
      xp: KK.xp_fatti + ' su ' + KK.xp, lungo: KK.lungo + ' yd', lega50: pct(KK.lega_50),
      testo: (KK.rookie === X.anno ? KK.nome + ', al primo anno nella lega, ' : (KK.rookie ? KK.nome + ', alla ' + (X.anno - KK.rookie + 1) + 'ª stagione, ' : KK.nome + ' ')) + 'quest’anno ha segnato ' + (f0.fatti + f1.fatti) + ' field goal su ' + (f0.tentati + f1.tentati) + ' sotto le 50 yard e ' + f2.fatti + ' su ' + f2.tentati + ' da 50 in su (la lega da 50+ segna ' + ilP(KK.lega_50) + ').' + (KK.lungo ? ' Il più lungo: ' + KK.lungo + ' yard.' : '') + ' Le occasioni dipendono da quante volte l’attacco dei ' + T.nome + ' si ferma tra le 25 e le 40 yard avversarie.'
    };

    // ---------------- difesa
    const DS = RE.dif[ruolo] || [];
    const OQ = RO.qb;
    const Pd = pressAttesa(T.avv);
    const ricAvv = RO.wr.concat(RO.te).filter((x) => !fuoriDi(x));
    const migliore = (() => {
      const vivi = DS.filter((x) => x.stato !== 'Out' && x.snap >= 40);
      if (ruolo === 'DL') return vivi.reduce((a, x) => (x.pr || 0) > (a ? a.pr || 0 : -1) ? x : a, null);
      if (ruolo === 'LB') return vivi.reduce((a, x) => (x.tak || 0) > (a ? a.tak || 0 : -1) ? x : a, null);
      return vivi.filter((x) => (x.tg || 0) >= 7).reduce((a, x) => (x.rat === null ? 999 : x.rat) < (a ? a.rat : 999) ? x : a, null);
    })();
    const metr = (x) => {
      const v = (y) => (y === null || y === undefined) ? '–' : (Number.isInteger(y) ? String(y) : fmt(y));
      if (ruolo === 'DL') return [['PRESSIONI', v(x.pr)], ['SACK', v(x.sk)], ['COLPI AL QB', v(x.hit)], ['PLACCAGGI', v(x.tak)]];
      if (ruolo === 'LB') return [['PLACCAGGI', v(x.tak)], ['MANCATI', v(x.miss)], ['TARGET CONCESSI', x.tg ? x.tg + ' · ' + pct(x.cmp) : v(x.tg)], ['BLITZ', v(x.bl)]];
      return [['TARGET', v(x.tg)], ['RICEZIONI CONCESSE', pct(x.cmp)], ['YARD/TARGET', v(x.ypt)], ['RATING CONCESSO', v(x.rat)]];
    };
    const notaDi = (x) => {
      if (ruolo === 'DL') return (x.pr_snap === null ? '' : fmt(x.pr_snap) + ' pressioni ogni 100 snap.') + '';
      if (ruolo === 'LB') return (x.tak ? (x.miss ? 'Manca ' + ilP(100 * x.miss / (x.tak + x.miss)) + ' dei placcaggi.' : 'Nessun placcaggio mancato.') : '') + (x.bl ? ' ' + x.bl + ' blitz in ' + x.g + ' partite.' : '');
      const duelli = ricAvv.filter((r) => r.difensori.some((d) => d.nome === x.nome)).map((r) => breveNome(r.nome));
      const intT = x.ints ? ' ' + x.ints + (x.ints === 1 ? ' intercetto.' : ' intercetti.') : '';
      return (duelli.length ? 'Probabile duello con ' + duelli.join(', ') + '.' : ((x.tg || 0) >= 5 ? 'Concede ' + fmt(x.ypt) + ' yard per target.' : 'Pochi palloni lanciati contro di lui.')) + intT;
    };
    const ordinati = DS.slice().sort((a, b) => (b.snap || 0) - (a.snap || 0));
    const listaD = ordinati.map((x) => ({
      nome: x.nome, ini: iniz(x.nome), imgBg: FOTO[att], img: fotoDi(x.nome), haImg: !!fotoDi(x.nome), sotto: (x.edge ? 'OLB · esterno di linea' : x.pos) + ' · ' + x.g + ' partite · ' + pct(x.snap) + ' degli snap' + (x.rientro ? ' · ' + x.rientro : ''),
      haStato: !!x.stato, stato: STATI[x.stato] || x.stato || '',
      metriche: metr(x).map(([lab, val]) => ({ lab, val })),
      barStyle: 'height: 6px; border-radius: 999px; width: ' + (x.snap || 0) + '%; background: ' + (x === migliore ? glow : 'rgba(255,255,255,0.55)') + ';',
      barTesto: 'in campo ' + nelP(x.snap) + ' degli snap' + (x === migliore ? ' · il più incisivo del reparto' : ''),
      nota: notaDi(x),
      style: 'border-radius: 22px; padding: 18px; color: #FFFFFF; ' + (x.stato === 'Out' ? 'opacity: 0.55; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,120,120,0.8);' : (x === migliore ? 'background: rgba(255,178,122,0.12); border: 1px solid ' + glow + '; box-shadow: 0 0 40px rgba(255,160,100,0.18);' : 'background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);'))
    }));
    // assenti del reparto: dall'injury report della partita (le carte mostrano solo i disponibili); contano i titolari
    // e chi aveva almeno il 20 per cento degli snap
    const REP_DC = { CB: ['LCB', 'RCB', 'NB', 'CB', 'DB'], S: ['FS', 'SS', 'S', 'SAF'], LB: ['LILB', 'RILB', 'MLB', 'ILB', 'LB', 'SLB', 'WLB', 'OLB', 'LOLB', 'ROLB'], DL: ['LDE', 'RDE', 'LDT', 'RDT', 'NT', 'DT', 'DE', 'DL', 'SLB', 'WLB', 'OLB', 'LOLB', 'ROLB'] };
    const assenti = ((X.injury && X.injury[att]) || []).filter((r) => (REP_DC[ruolo] || []).indexOf(r.pos) >= 0 && r.stato !== 'in dubbio' && r.stato !== 'gioca' && (r.tit || r.prima || (r.snap || 0) >= 20))
      .map((r) => r.nome + ' (' + r.stato + (r.prima ? ', ' + r.prima : (r.tit ? ', titolare' : '') + ', ' + r.snap + '% degli snap') + (r.sost ? '; al suo posto ' + r.sost : '') + ')');
    const dubbi = ((X.injury && X.injury[att]) || []).filter((r) => (REP_DC[ruolo] || []).indexOf(r.pos) >= 0 && r.stato === 'in dubbio').map((r) => r.nome);
    const rbAvv = SQ[T.avv].rb[0];
    const rbAvvYc = rbAvv.l.reduce((a, x) => a + x[0] * (x[1] || 0), 0) / rbAvv.tot;
    const teAvv = RO.te.filter((x) => !fuoriDi(x))[0];
    const deep = OQ.zone.slice(0, 3);
    let mTit = ''; let mTxt = ''; let mBuono = true;
    if (ruolo === 'DL') {
      mTit = 'PASS RUSH ' + T.breve + ' CONTRO LA LINEA ' + D.breve;
      mTxt = 'I ' + T.nome + ' mettono pressione (sack o colpo) sul ' + fmt(RE.rush.pr) + '% dei dropback (' + RE.rush.r_pr + '°); la linea dei ' + D.nome + ' la concede sul ' + fmt(OQ.prot) + '% (' + OQ.r_prot + '°). Pressione attesa ≈ ' + fmt(Pd, 0) + '%. ' +
        (rinfOL(T.avv).length ? 'Davanti hanno ' + (rinfOL(T.avv).length === 1 ? 'una riserva, ' : rinfOL(T.avv).length + ' riserve, ') + rinfOL(T.avv).join(' e ') + '. ' : '') +
        (OQ.clean_epa === null || OQ.press_epa === null ? '' : breveNome(OQ.nome) + ' sotto pressione passa da ' + fsg(OQ.clean_epa) + ' a ' + fsg(OQ.press_epa) + ' EPA per dropback' + (OQ.clean_epa - OQ.press_epa > 1 ? ': è la leva più forte.' : '.'));
      if (this.state.reale) mTxt += ' Com’è andata: pressione sul ' + fmt(REALE_PR[T.avv]) + '% dei dropback di ' + breveNome(OQ.nome) + '.';
      mBuono = Pd > LEGA_PR;
    } else if (ruolo === 'LB') {
      const lbT = DS.reduce((a, x) => a + (x.tak || 0), 0); const lbM = DS.reduce((a, x) => a + (x.miss || 0), 0);
      mTit = 'LINEBACKER ' + T.breve + ' CONTRO CORSE E TIGHT END ' + D.breve;
      mTxt = 'Il primo running back avversario è ' + rbAvv.nome + ' (' + fmt(rbAvvYc) + ' yard a corsa)' + (teAvv ? ', il tight end ' + teAvv.nome + ' (' + fsg(teAvv.epa) + ' EPA per target)' : '') + '. I linebacker dei ' + T.nome + ' mancano ' + ilP(100 * lbM / (lbT + lbM)) + ' dei placcaggi.' + (assenti.length ? ' In dubbio o fuori: ' + assenti.join(', ') + '.' : '');
      mBuono = true;
    } else if (ruolo === 'CB') {
      mTit = 'CORNERBACK ' + T.breve + ' CONTRO I RICEVITORI ' + D.breve;
      mTxt = 'I ricevitori dei ' + D.nome + ' disponibili: ' + ricAvv.map((r) => breveNome(r.nome) + ' (' + LATON[r.lato_main] + ')').join(', ') + '. ' + (assenti.length ? 'Ai ' + T.nome + ' mancano ' + assenti.join(', ') + '.' : 'Nessuna assenza tra i cornerback.') + (dubbi.length ? ' In dubbio: ' + dubbi.join(', ') + '.' : '') + ' I duelli sono quelli più probabili per lato, non coperture certe.';
      mBuono = !DS.some((x) => x.stato === 'Out');
    } else if (ruolo === 'S') {
      const qd = deep.reduce((a, z) => a + z.q, 0);
      mTit = 'SAFETY ' + T.breve + ' E IL GIOCO PROFONDO';
      mTxt = breveNome(OQ.nome) + ' lancia oltre le 20 yard ' + ilP(qd) + ' delle volte. La difesa dei ' + T.nome + ' nel profondo è ' + deep.map((z) => z.drank + '° ' + verso(z.lato)).join(', ') + ' (posti nella lega).' + (assenti.length ? ' Assenze: ' + assenti.join(', ') + '.' : '');
      mBuono = !assenti.length;
    }
    if (ruolo !== 'CB' && ['DL', 'LB', 'S'].indexOf(ruolo) >= 0) mTxt += (assenti.length ? ' Ai ' + T.nome + ' mancano ' + assenti.join(', ') + '.' : ' Nessuna assenza nel reparto.') + (dubbi.length ? ' In dubbio: ' + dubbi.join(', ') + '.' : '');
    const dif = {
      lista: listaD, fotoStyle: FOTO[att], matchTit: mTit, matchTesto: mTxt,
      matchStyle: mBuono ? BUONO : CATTIVO
    };

    // ---------------- linea d'attacco per le due squadre
    const OLD = X.old;
    const linea = OLD[att].map((o) => Object.assign({}, o, {
      ini: iniz(o.nome), imgBg: FOTO[att], img: fotoDi(o.nome), righeL: (o.righe || []).map((t) => ({ t })), haImg: !!fotoDi(o.nome),
      fotoStyle: FOTO[att] + (o.riserva ? ' outline: 2px dashed rgba(255,140,120,0.95); outline-offset: 4px;' : ''),
      barStyle: 'height: 6px; border-radius: 999px; width: ' + Math.round((33 - o.rank) / 32 * 100) + '%; background: ' + (o.rank <= 16 ? glow : '#4C9BFF') + ';'
    }));

        style: 'font-family: \'JetBrains Mono\', monospace; font-size: 11px; padding: 2px 8px; border-radius: 999px; ' + (r.stato === 'in dubbio' ? 'background: #FFD36B; color: #1A0E08;' : (r.stato === 'gioca' ? 'background: #8EE6B0; color: #04140A;' : 'background: #FF8C78; color: #1A0E08;')) })),

    const haPrev = TS.pw !== null && TS.pw !== undefined && TS.ph !== null && TS.pa !== null;
    if (!haPrev) {

      testa.probA = SQ[OSP].nome; testa.probH = SQ[CASA].nome; testa.barA = 'width: 50%; background: #4C9BFF;';

    // foto accanto al titolo di "Con gli occhi di": il giocatore per QB, RB e K; il logo della squadra per i reparti
    const tfNome = ruolo === 'QB' ? Q.nome : (ruolo === 'RB' ? R.nome : (ruolo === 'K' ? KK.nome : ((ruolo === 'WR' || ruolo === 'TE') && Rr ? Rr.nome : '')));

    return {
