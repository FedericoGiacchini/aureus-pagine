<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUREUS · Fantasy</title>

<link rel="icon" href="logo/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo/icona_180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#04060D}
a{color:#FFFFFF}a:hover{color:#FFD9B8}
/* stessa cascata e stessa tendina della pagina Stats (punto 50) */
@keyframes aurRiga{from{opacity:0;transform:translate(-70px,-14px)}to{opacity:1;transform:none}}
@keyframes aurCella{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.aur-riga-in{animation:aurRiga 700ms cubic-bezier(.16,.84,.24,1) both}
.aur-cella-in{animation:aurCella 520ms cubic-bezier(.16,.84,.24,1) both}
.aur-riga{transition:background 160ms ease}
.aur-riga:hover{background:rgba(255,255,255,0.07) !important}
.aur-btn{transition:background 160ms ease, color 160ms ease, box-shadow 160ms ease}
@keyframes aurTendina{from{opacity:0;transform:translateY(-22px) scaleY(.94)}to{opacity:1;transform:none}}
.aur-tendina{animation:aurTendina 560ms cubic-bezier(.16,.84,.24,1) both;transform-origin:top}
.aur-scroll{overflow-x:visible}
@media (max-width: 1000px){.aur-scroll{overflow-x:auto}}
@media (prefers-reduced-motion: reduce){.aur-riga-in,.aur-cella-in,.aur-tendina{animation:none}.aur-riga,.aur-btn{transition:none}}
</style>

</head>
<body>
<div id="app"></div>
<template id="modello">
<div style="position: relative; overflow: hidden; min-height: 100vh; background: #04060D; color: #F2F4FA; font-family: 'Inter', system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 640px; background: radial-gradient(ellipse 60% 70% at 50% 0%, rgba(255,150,90,0.30) 0%, rgba(40,90,255,0.22) 45%, rgba(4,6,13,0) 80%);"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, rgba(255,255,255,0) 1px, rgba(255,255,255,0) 7px);"></div>

  <div style="position: relative; max-width: 1360px; margin: 0 auto; padding: 0 16px 80px;">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 22px 0;">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF;">
        <img src="logo/aureus_piccolo.svg" alt="" width="46" height="46" style="display: block;">
        <span style="font-weight: 600; font-size: 18px; letter-spacing: 0.22em;">AUREUS</span>
      </a>
      <nav aria-label="Sezioni del sito" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; flex: 1 1 auto; font-family: 'JetBrains Mono', monospace; font-size: 13px;">
        <a href="index.html#partite" style="text-decoration: none; color: #C9D0E2;">Partite</a>
        <a href="week.html" style="text-decoration: none; color: #C9D0E2;">Week</a>
        <a href="fantasy.html" aria-current="page" style="text-decoration: none; color: #FFFFFF;"><span style="color: #FFB27A;">●</span> Fantasy</a>
        <a href="stats.html" style="text-decoration: none; color: #C9D0E2;">Stats</a>
        <a href="betting.html" style="text-decoration: none; color: #C9D0E2;">Betting</a>
        <a href="in_arrivo.html?s=Il%20modello" style="text-decoration: none; color: #C9D0E2;">Il modello</a>
      </nav>
    </header>

    <section aria-label="Fantasy" style="padding: 24px 0 6px;">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #E6EAF3;">{{sopra}}</div>
      <h1 style="margin: 10px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(48px, 8vw, 96px); line-height: 0.95; letter-spacing: -0.02em; color: #FFFFFF;">Il <span style="font-style: italic;">fantasy</span>.</h1>
    </section>

    <div role="group" aria-label="Parti della pagina" style="display: inline-flex; flex-wrap: wrap; gap: 4px; margin-top: 22px; padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); font-family: 'JetBrains Mono', monospace; font-size: 14px;">
      <sc-for list="{{parti}}" as="s"><button type="button" class="aur-btn" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="{{s.style}}">{{s.nome}}<span style="{{s.prestoStyle}}">{{s.presto}}</span></button></sc-for>
    </div>

    <!-- Classifiche della week (punto 52): punti previsti per ruolo -->
    <sc-if value="{{clAperte}}">
      <div style="margin-top: 22px;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
          <div role="group" aria-label="Ruolo" style="display: flex; flex-wrap: wrap; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px;">
            <sc-for list="{{cl.ruoli}}" as="r"><button type="button" class="aur-btn" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="{{r.style}}">{{r.nome}}</button></sc-for>
          </div>
          <div style="flex: 1 1 auto;"></div>
          <div role="group" aria-label="Punteggio" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); font-family: 'JetBrains Mono', monospace; font-size: 12.5px;">
            <sc-for list="{{cl.formati}}" as="m"><button type="button" class="aur-btn" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.nome}}</button></sc-for>
          </div>
        </div>
        <div style="margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;">
          <span style="color: #AEB7CC; margin-right: 4px;">WEEK</span>
          <sc-for list="{{cl.weeks}}" as="w"><button type="button" class="aur-btn" onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="{{w.style}}">{{w.nome}}</button></sc-for>
        </div>
        <h2 style="margin: 22px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 42px; line-height: 1;">Week {{cl.week}} <span style="font-style: italic; color: #AEB7CC;">{{cl.sotto}}</span></h2>
        <div style="margin-top: 6px; font-size: 12.5px; color: #8F9BB8; line-height: 1.5;">{{cl.nota}}</div>
        <sc-if value="{{cl.errore}}"><div style="margin-top: 14px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,0.06); color: #C9D0E2;">{{cl.errore}}</div></sc-if>
        <sc-if value="{{cl.ok}}">
          <div class="aur-scroll" style="margin-top: 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(8,11,22,0.75); overflow: hidden;">
            <div style="{{cl.larghezza}}">
              <div style="{{cl.testa}}">
                <div style="text-align: center;">#</div><div>Giocatore</div>
                <sc-for list="{{cl.colonne}}" as="c"><div style="{{c.style}}">{{c.n}}</div></sc-for>
              </div>
              <sc-for list="{{cl.righe}}" as="r">
                <div class="{{r.cls}}" style="{{r.style}}">
                  <div style="text-align: center;"><span style="{{r.posStyle}}">{{r.pos}}</span></div>
                  <div style="display: flex; align-items: center; gap: 9px; min-width: 0;">
                    <span style="{{r.av}}">{{r.ini}}<sc-if value="{{r.haFoto}}"><img src="{{r.foto}}" alt="" loading="lazy" onerror="this.remove()" style="{{r.fotoStyle}}"></sc-if></span>
                    <span style="min-width: 0;"><span style="display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.nome}}</span><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #AEB7CC;">{{r.sotto}}</span></span>
                  </div>
                  <sc-for list="{{r.celle}}" as="v"><div class="{{v.cls}}" style="{{v.style}}">{{v.t}}</div></sc-for>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <!-- La tua lega (punto 52): la lega Sleeper con le sue regole, la tua sfida e la probabilita' di vincerla -->
    <sc-if value="{{lgAperta}}">
      <div style="margin-top: 22px; padding: 18px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);">
        <div role="group" aria-label="Come trovare la lega" style="display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); font-family: 'JetBrains Mono', monospace; font-size: 12.5px;">
          <sc-for list="{{lg.modi}}" as="m"><button type="button" class="aur-btn" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.nome}}</button></sc-for>
        </div>
        <sc-if value="{{lg.perUtente}}">
          <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;">
            <label style="display: flex; flex-direction: column; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #AEB7CC; flex: 1 1 320px;">NOME UTENTE SLEEPER
              <input id="utente-campo" type="text" autocomplete="off" placeholder="il tuo nome utente su Sleeper" value="{{lg.utente}}" style="font: 15px 'JetBrains Mono', monospace; padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); background: #0A0E1C; color: #FFFFFF;"></label>
            <button type="button" class="aur-btn" onClick="{{lg.cercaLeghe}}" style="cursor: pointer; padding: 11px 22px; border-radius: 12px; border: 0; background: #FFB27A; color: #1A0E08; font: 600 14px 'JetBrains Mono', monospace;">Cerca le mie leghe</button>
          </div>
          <sc-if value="{{lg.haTrovate}}">
            <div style="margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #AEB7CC;">SCEGLI LE LEGHE DA SEGUIRE ({{lg.nScelte}} su {{lg.nTrovate}})</div>
            <div style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px;">
              <sc-for list="{{lg.trovate}}" as="x"><button type="button" class="aur-btn" onClick="{{x.pick}}" aria-pressed="{{x.on}}" style="{{x.style}}">{{x.segno}} {{x.nome}}</button></sc-for>
            </div>
          </sc-if>
        </sc-if>
        <sc-if value="{{lg.perCodice}}">
          <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;">
            <label style="display: flex; flex-direction: column; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #AEB7CC; flex: 1 1 320px;">CODICE DELLA LEGA SLEEPER
              <input id="lega-campo" type="text" inputmode="numeric" autocomplete="off" placeholder="es. 1353579205677314048" value="{{lg.codice}}" style="font: 15px 'JetBrains Mono', monospace; padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); background: #0A0E1C; color: #FFFFFF;"></label>
            <button type="button" class="aur-btn" onClick="{{lg.carica}}" style="cursor: pointer; padding: 11px 22px; border-radius: 12px; border: 0; background: #FFB27A; color: #1A0E08; font: 600 14px 'JetBrains Mono', monospace;">Carica</button>
          </div>
        </sc-if>
        <div style="margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;">
          <span style="color: #AEB7CC; margin-right: 4px;">WEEK</span>
          <sc-for list="{{lg.weeks}}" as="w"><button type="button" class="aur-btn" onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="{{w.style}}">{{w.nome}}</button></sc-for>
          <sc-if value="{{lg.haSalvate}}"><span style="width: 1px; height: 20px; background: rgba(255,255,255,0.18); margin: 0 6px;"></span><span style="color: #AEB7CC; margin-right: 4px;">LE TUE LEGHE</span>
            <sc-for list="{{lg.salvate}}" as="x"><button type="button" class="aur-btn" onClick="{{x.pick}}" aria-pressed="{{x.on}}" style="{{x.style}}">{{x.nome}}</button></sc-for></sc-if>
        </div>
        <div role="status" style="margin-top: 10px; font-size: 13px; color: {{lg.statoCol}};">{{lg.stato}}</div>
      </div>

      <sc-if value="{{lg.ok}}">
        <h2 style="margin: 24px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 42px; line-height: 1;">{{lg.nome}} <span style="font-style: italic; color: #AEB7CC;">· week {{lg.week}}</span></h2>
        <div style="margin-top: 6px; font-size: 12.5px; color: #8F9BB8; line-height: 1.5;">{{lg.nota}}</div>
        <div style="margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;">
          <span style="color: #AEB7CC; margin-right: 4px;">LA TUA SQUADRA</span>
          <sc-for list="{{lg.squadre}}" as="x"><button type="button" class="aur-btn" onClick="{{x.pick}}" aria-pressed="{{x.on}}" style="{{x.style}}">{{x.nome}}</button></sc-for>
        </div>

        <sc-if value="{{lg.haSfida}}">
          <div style="margin-top: 18px; border-radius: 26px; padding: 22px; background: linear-gradient(180deg, rgba(255,178,122,0.10), rgba(8,11,22,0.85)); border: 1px solid rgba(255,178,122,0.25);">
            <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px;">
              <div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">LA TUA SQUADRA</div><div style="font-family: 'Instrument Serif', serif; font-size: 30px; line-height: 1.05;">{{sf.a.nome}}</div></div>
              <div style="text-align: center; font-family: 'Instrument Serif', serif; font-size: 46px; line-height: 1; white-space: nowrap;">{{sf.a.tot}} <span style="color: #6F7A94;">–</span> {{sf.b.tot}}</div>
              <div style="text-align: right;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">AVVERSARIO</div><div style="font-family: 'Instrument Serif', serif; font-size: 30px; line-height: 1.05;">{{sf.b.nome}}</div></div>
            </div>
            <!-- probabilita' di vincere: barra divisa tra le due squadre -->
            <div style="margin-top: 16px; display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.08);"><span style="{{sf.barraA}}"></span><span style="{{sf.barraB}}"></span></div>
            <div style="margin-top: 8px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 13px;"><span style="color: #FFB27A; font-weight: 700;">vinci al {{sf.pa}}</span><span style="color: #AEB7CC;">{{sf.pb}}</span></div>
            <div style="margin-top: 16px; display: grid; gap: 4px;">
              <sc-for list="{{sf.righe}}" as="r">
                <div style="{{r.style}}">
                  <div style="display: flex; align-items: center; gap: 8px; min-width: 0;"><span style="{{r.a.av}}">{{r.a.ini}}<sc-if value="{{r.a.haFoto}}"><img src="{{r.a.foto}}" alt="" loading="lazy" onerror="this.remove()" style="{{r.a.fotoStyle}}"></sc-if></span><span style="min-width: 0;"><span style="display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.a.nome}}</span><span style="display: block; font-size: 11px; color: #AEB7CC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.a.det}}</span></span></div>
                  <div style="text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; {{r.a.ptStyle}}">{{r.a.pt}}</div>
                  <div style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">{{r.slot}}</div>
                  <div style="font-variant-numeric: tabular-nums; font-weight: 700; {{r.b.ptStyle}}">{{r.b.pt}}</div>
                  <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; text-align: right;"><span style="min-width: 0;"><span style="display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.b.nome}}</span><span style="display: block; font-size: 11px; color: #AEB7CC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.b.det}}</span></span><span style="{{r.b.av}}">{{r.b.ini}}<sc-if value="{{r.b.haFoto}}"><img src="{{r.b.foto}}" alt="" loading="lazy" onerror="this.remove()" style="{{r.b.fotoStyle}}"></sc-if></span></div>
                </div>
              </sc-for>
            </div>
            <div style="margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: {{sf.idealeBg}};">
              <div style="font-weight: 700;">{{sf.idealeTit}}</div>
              <sc-for list="{{sf.cambi}}" as="c"><div style="margin-top: 4px; font-size: 13.5px;">{{c}}</div></sc-for>
            </div>
            <sc-if value="{{sf.haPanca}}">
              <div style="margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">LA TUA PANCHINA</div>
              <div style="margin-top: 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 6px;">
                <sc-for list="{{sf.panca}}" as="p"><div style="{{p.style}}">
                  <div style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">{{p.pos}}</div>
                  <div style="display: flex; align-items: center; gap: 8px; min-width: 0;"><span style="{{p.av}}">{{p.ini}}<sc-if value="{{p.haFoto}}"><img src="{{p.foto}}" alt="" loading="lazy" onerror="this.remove()" style="{{p.fotoStyle}}"></sc-if></span><span style="min-width: 0;"><span style="display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.nome}}</span><span style="display: block; font-size: 11px; color: #AEB7CC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.det}}</span></span></div>
                  <div style="text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; {{p.ptStyle}}">{{p.pt}}</div>
                </div></sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <div style="margin-top: 22px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">TUTTE LE SFIDE DELLA WEEK</div>
        <div style="margin-top: 8px; display: grid; gap: 6px;">
          <sc-for list="{{lg.sfide}}" as="x">
            <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 14px; background: {{x.bg}};">
              <span style="font-weight: 600;">{{x.a}} <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">{{x.pa}}</span></span>
              <span style="font-variant-numeric: tabular-nums; font-weight: 700;">{{x.ta}} – {{x.tb}}</span>
              <span style="text-align: right; font-weight: 600;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #AEB7CC;">{{x.pb}}</span> {{x.b}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </sc-if>
    <sc-if value="{{inArrivo}}">
      <div style="margin-top: 28px; padding: 28px; border-radius: 24px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); max-width: 640px;">
        <div style="font-family: 'Instrument Serif', serif; font-size: 34px;">{{arrivoTit}}: <span style="font-style: italic;">in arrivo</span>.</div>
        <p style="margin: 10px 0 0; color: #C9D0E2; line-height: 1.5;">{{arrivoTxt}}</p>
      </div>
    </sc-if>

    <sc-if value="{{matchupAperto}}">
      <div style="margin-top: 22px;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
          <div role="group" aria-label="Ruolo" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px;">
            <sc-for list="{{ruoli}}" as="r"><button type="button" class="aur-btn" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="{{r.style}}">{{r.nome}}</button></sc-for>
          </div>
          <div style="flex: 1 1 auto;"></div>
          <div role="group" aria-label="Punteggio" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); font-family: 'JetBrains Mono', monospace; font-size: 12.5px;">
            <sc-for list="{{formati}}" as="m"><button type="button" class="aur-btn" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.nome}}</button></sc-for>
          </div>
          <div role="group" aria-label="Totali o media a partita" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); font-family: 'JetBrains Mono', monospace; font-size: 12.5px;">
            <sc-for list="{{modi}}" as="m"><button type="button" class="aur-btn" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.nome}}</button></sc-for>
          </div>
        </div>

        <div style="margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;">
            <span style="color: #AEB7CC; margin-right: 4px;">WEEK</span>
            <sc-for list="{{weekScelte}}" as="w"><button type="button" class="aur-btn" onClick="{{w.pick}}" aria-pressed="{{w.on}}" aria-label="{{w.aria}}" style="{{w.style}}">{{w.nome}}</button></sc-for>
            <span style="width: 1px; height: 22px; background: rgba(255,255,255,0.18); margin: 0 4px;"></span>
            <sc-for list="{{scorciatoie}}" as="s"><button type="button" class="aur-btn" onClick="{{s.pick}}" style="{{s.style}}">{{s.nome}}</button></sc-for>
          </div>
          <div style="margin-top: 10px; font-size: 12.5px; color: #C9D0E2;">{{periodoTxt}}</div>
        </div>

        <h2 style="margin: 22px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 42px; line-height: 1;">Matchup <span style="font-style: italic; color: #AEB7CC;">{{titoloSotto}}</span></h2>

  var ETI = { pass_att: "Passaggi tentati", pass_cmp: "Passaggi completi", pass_inc: "Passaggi incompleti",
    pass_yd: "Yard su passaggio", pass_td: "TD su passaggio", pass_int: "Intercetti", rush_att: "Corse",

    xpm: "Extra point segnati", xpmiss: "Extra point sbagliati", sack: "Sack", int: "Intercetti", fum_rec: "Fumble recuperati",
    ff: "Fumble forzati", def_td: "TD della difesa", safe: "Safety", blk_kick: "Calci bloccati",
    def_st_td: "TD su ritorno", def_st_ff: "Fumble forzati (special team)", def_st_fum_rec: "Fumble recuperati (special team)",
    pts_allow_0: "Punti concessi 0", pts_allow_1_6: "Punti concessi 1-6", pts_allow_7_13: "Punti concessi 7-13",
    pts_allow_14_20: "Punti concessi 14-20", pts_allow_21_27: "Punti concessi 21-27", pts_allow_28_34: "Punti concessi 28-34",
    pts_allow_35p: "Punti concessi 35+" };
  var STAT = { QB: ["pass_cmp", "pass_att", "pass_yd", "pass_td", "pass_int", "rush_att", "rush_yd", "rush_td", "fum_lost"],
    RB: ["rush_att", "rush_yd", "rush_td", "rec_tgt", "rec", "rec_yd", "rec_td", "fum_lost"],
    WR: ["rec_tgt", "rec", "rec_yd", "rec_td", "rush_att", "rush_yd"], TE: ["rec_tgt", "rec", "rec_yd", "rec_td"],
    K: ["fga", "fgm", "fgm_40_49", "fgm_50p", "xpm"], DEF: ["sack", "int", "fum_rec", "def_td", "safe"] };
  function iniziali(n) { return String(n || "").split(/\s+/).filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join("").toUpperCase(); }
  function avatar(g) {
    var ini = esc(iniziali(g && g.n));
    if (!g || !g.f) return '<span class="av">' + ini + "</span>";
    return '<span class="av"><span>' + ini + '</span><img src="' + esc(g.f) + '" alt="" loading="lazy" ' +
      'onload="this.parentNode.classList.add(\'ok\')" onerror="this.remove()"></span>';
  }
  function bloccato(g) { return !!g && (g.giocata || (g.ko && new Date(g.ko) <= new Date())); }

  function fmt(x, d) { return (x == null || isNaN(x)) ? "–" : x.toLocaleString("it-IT",
    { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function prendi(url) { return fetch(url).then(function (r) {
    if (!r.ok) throw new Error(r.status === 404 ? "non trovato" : "errore " + r.status); return r.json(); }); }

  // normale: probabilita' che i punti concessi cadano in ogni fascia di Sleeper (0, 1-6, ... 35+)
  function Phi(z) { var t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
    var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    return z > 0 ? 1 - p : p; }
  function fascePA(m, sd) {
    var cut = [0.5, 6.5, 13.5, 20.5, 27.5, 34.5], nomi = ["pts_allow_0","pts_allow_1_6","pts_allow_7_13",
      "pts_allow_14_20","pts_allow_21_27","pts_allow_28_34","pts_allow_35p"], out = {}, prev = 0;
    for (var i = 0; i < cut.length; i++) { var c = Phi((cut[i] - m) / sd); out[nomi[i]] = c - prev; prev = c; }
    out[nomi[6]] = 1 - prev; return out; }

  function punti(g, sc) {
    var e = Object.assign({}, g.e || {});
    if (g.r === "DEF" && g.pa != null) Object.assign(e, fascePA(g.pa, Math.max(g.pa_sd, 3)));
    // fasce dei field goal: se la lega da' punti per fascia, il conteggio per fascia; i 50+ o 50-59/60+ come la lega
    if (g.r === "K") {
      var usa5059 = sc.fgm_50_59 != null || sc.fgm_60p != null;
      if (usa5059) delete e.fgm_50p; else { delete e.fgm_50_59; delete e.fgm_60p; }
      var perFascia = ["fgm_0_19","fgm_20_29","fgm_30_39","fgm_40_49","fgm_50p","fgm_50_59","fgm_60p"]
        .some(function (k) { return sc[k]; });
      if (perFascia) delete e.fgm;
    }
    var tot = 0, parti = [];
    Object.keys(e).forEach(function (k) { var v = sc[k]; if (v) { tot += v * e[k]; parti.push([k, v * e[k]]); } });
    return { tot: tot, parti: parti };
  }

  function perche(g) {
    var m = g.m;
    if (!m) return '<section><h4>Perché</h4><p class="perche">' + (/^(QB|RB|WR|TE)$/.test(g.r) || !g.e ? "Nessuna spiegazione per questa week." :
      "Nessuna spiegazione per questa week.") + "</p></section>";
    if (m.sez) {
      var c2 = (m.c || []).map(function (x) {
        return '<li class="ch ch-' + (x.s === "+" ? "pos" : x.s === "-" ? "neg" : "info") + '">' + esc(x.t) + "</li>"; }).join("");
      return '<section><h4>Perché</h4><p class="giudizio">' + esc(m.g) + "</p>" +
        m.sez.map(function (x) { return '<h4 class="sotto">' + esc(x.t) + '</h4><p class="racconto">' + esc(x.p) + "</p>"; }).join("") +
        (c2 ? '<h4 class="sotto">' + esc(m.ct || "Il confronto con la difesa") + '</h4><ul class="chicche">' + c2 + "</ul>" : "") +
        (m.r1 ? '<p class="unariga"><b>In una riga.</b> ' + esc(m.r1) + "</p>" : "") +
        (m.n ? '<p class="nota-p">' + esc(m.n) + "</p>" : "") + "</section>";
    }
    var r = (m.r || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");
    var c = (m.c || []).map(function (x) {
      return '<li class="ch ch-' + (x.s === "+" ? "pos" : x.s === "-" ? "neg" : "info") + '">' + esc(x.t) + "</li>"; }).join("");
    return '<section><h4>Perché</h4><p class="giudizio">' + esc(m.g) + "</p>" + (r ? '<ul class="perche-l">' + r + "</ul>" : "") +
      (c ? '<h4 class="sotto">Il confronto con la difesa</h4><ul class="chicche">' + c + "</ul>" : "") + "</section>";
  }

  function scheda(g) {
    var sc = scoringOra, e = g.e || {}, p = g.e ? punti(g, sc) : { tot: 0, parti: [] };
    var stat = (STAT[g.r] || []).filter(function (k) { return e[k] != null; }).map(function (k) {

      const n = Math.max(A.tit.length, B ? B.tit.length : 0);
      sf.righe = []; for (let i = 0; i < n; i++) sf.righe.push({ slot: posti[i] || '', a: cella(A.tit[i]), b: cella(B ? B.tit[i] : null),
        style: 'display: grid; grid-template-columns: minmax(0, 1fr) 54px 64px 54px minmax(0, 1fr); align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; background: ' + (i % 2 ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.06)') + ';' });
      // formazione ideale: i posti fissi prima, poi i flessibili dal piu' stretto; chi ha gia' giocato resta dov'e'
      const pool = A.tit.filter((x) => x.g).concat(A.panca.filter((x) => x.g)); const usati = {}; const scelta = [];
      posti.forEach((t, i) => { const cur = A.tit[i]; if (!ELIG[t] || (cur && cur.fermo)) { scelta[i] = cur && cur.g ? cur : null; if (cur) usati[cur.id] = 1; } });
      A.panca.forEach((x) => { if (x.fermo) usati[x.id] = 1; });
      posti.map((t, i) => i).filter((i) => scelta[i] === undefined).sort((a, b) => ELIG[posti[a]].length - ELIG[posti[b]].length).forEach((i) => {
        const c = pool.filter((x) => !usati[x.id] && x.pos && ELIG[posti[i]].indexOf(x.pos) >= 0).sort((a, b) => b.pt - a.pt)[0]; scelta[i] = c || null; if (c) usati[c.id] = 1; });
      const totI = scelta.reduce((a, x) => a + (x ? x.pt : 0), 0);
      const ora = {}; A.tit.forEach((x) => { if (x.id && x.id !== '0') ora[x.id] = 1; }); const dopo = {}; scelta.forEach((x) => { if (x) dopo[x.id] = 1; });
      const entrano = scelta.filter((x) => x && !ora[x.id]).sort((a, b) => b.pt - a.pt); const escono = A.tit.filter((x) => x.id && x.id !== '0' && !dopo[x.id]);
      if (totI - A.tot > 0.05 && entrano.length) {
        const vA = Object.assign({}, A, { tot: totI }); const pI = prob(vA, B);
        sf.idealeTit = 'Formazione ideale: ' + fmt(totI, 1) + ' punti (+' + fmt(totI - A.tot, 1) + ')' + (pI != null ? ', vinceresti al ' + pct(pI) : '');
        sf.cambi = entrano.map((x) => { const k = escono.findIndex((y) => y.pos === x.pos); const y = k >= 0 ? escono.splice(k, 1)[0] : escono.shift();
          return (x.pos || '') + ': dentro ' + x.g.n + ' (' + fmt(x.pt, 1) + ')' + (y && y.g ? ', fuori ' + y.g.n + ' (' + fmt(y.pt, 1) + ')' : ''); });
        sf.idealeBg = 'rgba(255,178,122,0.16)';
      } else { sf.idealeTit = 'La formazione schierata è già la migliore secondo AUREUS.'; sf.cambi = []; sf.idealeBg = 'rgba(61,220,151,0.12)'; }
      sf.haPanca = A.panca.length ? 'true' : '';
      // panchina come la formazione (Federico, 10 novembre 2026): foto, nome, squadra e avversario, ruolo, punti
      sf.panca = A.panca.map((x, i) => Object.assign(cella(x), { style: 'display: grid; grid-template-columns: 40px minmax(0, 1fr) 54px; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; background: ' + (i % 2 ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.06)') + ';' }));
      return { lg, sf };
    })();
    const FMT = { std: 'Std (0 punti a ricezione)', half: '1/2 PPR (0,5 a ricezione)', ppr: 'PPR (1 a ricezione)' }[st.formato];
    return {
      sopra, parti, inArrivo: '', clAperte: st.parte === 'classifiche' ? 'true' : '', lgAperta: st.parte === 'lega' ? 'true' : '', cl: clVals(), lg: lgVals.lg, sf: lgVals.sf, arrivoTit: (ARRIVO[st.parte] || [''])[0], arrivoTxt: (ARRIVO[st.parte] || ['', ''])[1],
      matchupAperto: st.parte === 'matchup' ? 'true' : '', ruoli, formati, modi, weekScelte, scorciatoie, periodoTxt,
      titoloSotto: '· contro ' + (posto ? 'i ' + gr + posto : NOMI_R[gr]),
      nota: gr === 'K' ? 'Quanto hanno fatto contro ogni difesa i kicker avversari. In testa la difesa più generosa. Punti dei kicker: 3 per field goal fino a 39 yard, 4 da 40 a 49, 5 da 50 in su, −1 per calcio sbagliato; extra point 1, −1 se sbagliato.' : 'Quanto hanno fatto contro ogni difesa ' + (posto ? 'i ' + gr + posto + ' avversari (posto ' + posto + ' nella depth chart della loro squadra tra chi ha giocato: se il ' + gr + '1 manca, il ' + gr + '2 sale)' : 'tutti i ' + gr + ' avversari') + '. In testa la difesa più generosa. Punti fantasy in ' + FMT + '.',
      larghezza, testaStyle, colonne, righe, det, tendCls: st.tendina ? 'aur-tendina' : '',
      legenda: 'Clicca il nome di una colonna per ordinare (di nuovo per invertire). Dettaglio apre i giocatori affrontati, con un filtro delle week tutto suo. Punti fantasy: 0,04 a yard lanciata, 4 per TD su lancio, −1 per intercetto, 0,1 a yard corsa o ricevuta, 6 per TD, 2 per trasformazione da 2, −2 per fumble perso.'
    };
  }
}
