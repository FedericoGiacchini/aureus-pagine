    const nick = (t) => (SQ[t] && SQ[t].nome) || t;
    const tz = { timeZone: 'Europe/Rome' };
    const quando = (s) => { const d = new Date(String(s).replace(' ', 'T').replace(/\+(\d\d)$/, '+$1:00')); return d.toLocaleDateString('it-IT', Object.assign({ weekday: 'short', day: 'numeric' }, tz)).replace(/\./g, '') + ' ' + d.toLocaleTimeString('it-IT', Object.assign({ hour: '2-digit', minute: '2-digit' }, tz)); };
    const chip = (on) => 'cursor: pointer; padding: 7px 12px; border-radius: 999px; font: 12.5px \'JetBrains Mono\', monospace; ' + (on ? 'background: #FFFFFF; color: #04060D; border: 1px solid #FFFFFF; font-weight: 600;' : 'background: transparent; color: #C9D0E2; border: 1px solid rgba(255,255,255,0.22);');
    const set = (k, v) => () => { const s = { quante: 120, tipo: 'tutte' }; s[k] = v; if (k === 'gid') s.team = 'tutte'; this.setState(s); };
    const logo = (t, sep) => ({ ab: t, sep: sep ? 'true' : '', logo: (SQ[t] && SQ[t].logo) || '', haLogo: !!(SQ[t] && SQ[t].logo),
      badge: 'position: relative; overflow: hidden; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-size: 8px; font-weight: 700; color: #FFFFFF; background: ' + ((SQ[t] && SQ[t].col) || '#56636b') + ';' });
    // logo OSP @ CASA logo (Federico, 10 novembre 2026)
    const fPartite = [{ k: 'tutte', n: 'Tutte', sx: [], dx: [] }].concat(D.partite.map((p) => ({ k: p.gid, n: p.osp + ' @ ' + p.casa, aria: nick(p.osp) + ' a ' + nick(p.casa), sx: [logo(p.osp)], dx: [logo(p.casa)] })))
      .map((x) => ({ nome: x.n, aria: x.aria || x.n, sx: x.sx, dx: x.dx, on: String(st.gid === x.k), style: chip(st.gid === x.k), pick: set('gid', x.k) }));
    const squadreV = st.gid === 'tutte' ? [...new Set(D.partite.flatMap((p) => [p.osp, p.casa]))].sort() : (() => { const p = D.partite.find((x) => x.gid === st.gid); return [p.osp, p.casa]; })();
    const fSquadre = ['tutte'].concat(squadreV).map((t) => ({ nome: t === 'tutte' ? 'Tutte' : nick(t), loghi: t === 'tutte' ? [] : [logo(t, false)], on: String(st.team === t), style: chip(st.team === t), pick: set('team', t) }));
    const fGruppi = [['tutti', 'Tutti'], ['generali', 'Generali'], ['squadra', 'Squadra'], ['giocatori', 'Giocatori']].map(([k, n]) => ({ nome: n, on: String(st.gruppo === k), style: chip(st.gruppo === k), pick: set('gruppo', k) }));
    const DIF = ['DL', 'LB', 'CB', 'S', 'DB', 'DE', 'DT', 'NT', 'OLB', 'ILB', 'MLB', 'FS', 'SS', 'EDGE'];
    const fRuoli = [['tutti', 'Tutti'], ['QB', 'QB'], ['RB', 'RB'], ['WR', 'WR'], ['TE', 'TE'], ['K', 'K'], ['DIF', 'Difensori']].map(([k, n]) => ({ nome: n, on: String(st.ruolo === k), style: chip(st.ruolo === k), pick: set('ruolo', k) }));
    const base = D.righe.filter((r) => (st.gid === 'tutte' || r.gid === st.gid) && (st.team === 'tutte' || r.team === st.team || (r.gruppo === 'generali' && (r.casa === st.team || r.osp === st.team)))
      && (st.gruppo === 'tutti' || r.gruppo === st.gruppo)
      && (st.ruolo === 'tutti' || (st.ruolo === 'DIF' ? DIF.indexOf(r.ruolo) >= 0 : r.ruolo === st.ruolo)));
    const tipoChip = (k, n) => ({ nome: n, on: String(st.tipo === k), style: chip(st.tipo === k), pick: () => this.setState({ tipo: k, quante: 120 }) });
    const fTutteTipi = [tipoChip('tutte', 'Tutte')];
    const ORD_T = ['Vincente', 'Handicap', 'Totale punti', 'Punti della squadra', 'Yard totali', 'TD della squadra', 'Sack della difesa', 'Field goal segnati',
      'Yard con i passaggi', 'TD con i passaggi', 'Passaggi tentati', 'Passaggi completati', 'Intercetti', 'Yard con passaggi e corse', 'Yard con le corse',
      'Tentativi di corsa', 'Yard con corse e ricezione', 'Yard con ricezione', 'Ricezioni', 'TD in qualsiasi momento', 'Punti del kicker', 'Sack', 'Intercetti difensivi'];
    const fTipiGruppi = [['generali', 'Generali'], ['squadra', 'Squadra'], ['giocatori', 'Giocatori']].map(([g, n]) => {
      const tt = [...new Set(base.filter((r) => r.gruppo === g).map((r) => r.mercato))].sort((a, b) => ORD_T.indexOf(a) - ORD_T.indexOf(b));
      return { nome: n.toUpperCase(), tipi: tt.map((t) => tipoChip(t, t)) }; }).filter((g) => g.tipi.length);
    const fOrdini = [['edge', 'Edge più alto', '#3DDC97'], ['basso', 'Edge più basso', '#FF7A7A']].map(([k, n, c]) => ({ nome: n, on: String(st.ordine === k),
      style: 'cursor: pointer; padding: 7px 12px; border-radius: 999px; font: 12.5px \'JetBrains Mono\', monospace; ' + (st.ordine === k ? 'background: ' + c + '; color: #04060D; border: 1px solid ' + c + '; font-weight: 600;' : 'background: transparent; color: ' + c + '; border: 1px solid ' + c + '66;'),
      pick: () => this.setState({ ordine: k }) }));
    let R = base.filter((r) => st.tipo === 'tutte' || r.mercato === st.tipo);
    if (st.ordine === 'basso') R = R.slice().sort((a, b) => a.edge - b.edge);
    const rari = (m) => /TD|Intercetti|Sack|Field/.test(m);
    const latoTxt = (r) => {
      const L = r.linea === null || r.linea === undefined ? '' : ' ' + fmt(r.linea, 1);
      if (r.mercato === 'Vincente') return nick(r.team) + ' vince';
      if (r.mercato === 'Handicap') return nick(r.team) + ' ' + (r.linea > 0 ? '+' : '') + fmt(r.linea, 1);
      return ({ over: 'Over', under: 'Under', yes: 'Sì', no: 'No' }[r.lato] || r.lato) + L;
    };
    const righe = R.slice(0, st.quante).map((r) => {
      const e = 100 * r.edge; const forza = Math.min(1, Math.abs(e) / 12);
      const rgb = e >= 0 ? [61, 220, 151] : [255, 110, 110];
      const mix = (c) => Math.round(200 + (c - 200) * (0.35 + 0.65 * forza));
      return {
        partita: r.osp + ' @ ' + r.casa, quando: r.iniziata ? 'iniziata' : quando(r.ko),
        chi: r.nome ? r.nome + (r.ruolo ? ' · ' + r.ruolo : '') : r.mercato === 'Totale punti' ? nick(r.osp) + ' – ' + nick(r.casa) : nick(r.team),
        cosa: r.mercato, lato: latoTxt(r),
        mossa: r.apertura !== null && r.apertura !== undefined && r.linea !== null && r.apertura !== r.linea ? 'apertura ' + fmt(r.apertura, 1) : '',
        prev: r.prev === null || r.prev === undefined ? '–' : fmt(r.prev, rari(r.mercato) ? 2 : 1),
        pn: fmt(100 * r.pn, 0) + '%', pm: fmt(100 * r.pm, 0) + '%', quota: fmt(r.quota, 2),
        edge: (e > 0 ? '+' : '') + fmt(e, 1), nb: r.nb ? r.nb + ' book' : 'media',
        edgeStyle: 'color: rgb(' + rgb.map(mix).join(',') + ');',
        style: 'display: grid; grid-template-columns: 110px minmax(0, 1.6fr) minmax(0, 1.2fr) 90px 80px 80px 90px 60px; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: rgba(' + rgb.join(',') + ',' + (0.03 + 0.15 * forza).toFixed(3) + ');' + (r.iniziata ? ' opacity: 0.55;' : '')
      };
    });
    const pos = R.filter((r) => r.edge > 0).length;
    return {
      link: D.link, fPartite, fSquadre, fGruppi, fRuoli, fTutteTipi, fTipiGruppi, fOrdini, righe,
      conRuolo: st.gruppo === 'tutti' || st.gruppo === 'giocatori' ? 'true' : '',
      sopra: 'STAGIONE ' + D.stagione + ' · WEEK ' + D.week + ' · LINEE SCARICATE ' + quando(D.scaricato).toUpperCase(),
      conteggio: R.length + ' linee · ' + pos + ' con edge positivo',
      altri: R.length > st.quante ? 'true' : '', altriTxt: 'Mostra altre ' + Math.min(120, R.length - st.quante), mostraAltri: () => this.setState({ quante: st.quante + 120 }),
      legenda: 'Noi prev.: il valore che prevede il modello. Noi e Mercato: probabilità del lato mostrato, senza il margine del book (media dei book, ognuno alla sua linea). Edge = Noi − Mercato; per ogni linea si mostra il lato con l’edge più alto. Linea: la più comune tra i book; “apertura” se si è mossa. Conteggi rari (TD, intercetti, sack, field goal) con la distribuzione di Poisson; il resto con una normale e lo scarto tipico misurato sulle stagioni 2019-2025. Versioni: ' + D.versioni.vittorie + ', ' + D.versioni.squadra + ', ' + D.versioni.giocatori + ', ' + D.versioni.special + ', ' + D.versioni.difesa + '.'
    };
  }
}

var c = AureusMonta(document.getElementById('modello'), Component, document.getElementById('app'), {});
</script>
