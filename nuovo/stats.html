<style>
body{margin:0;background:#04060D}
a{color:#FFFFFF}a:hover{color:#FFD9B8}
/* classifica a cascata (punto 50): ogni riga entra dall'alto a sinistra, poi i suoi numeri da sinistra verso destra */
@keyframes aurRiga{from{opacity:0;transform:translate(-70px,-14px)}to{opacity:1;transform:none}}
@keyframes aurCella{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.aur-riga-in{animation:aurRiga 700ms cubic-bezier(.16,.84,.24,1) both}
.aur-cella-in{animation:aurCella 520ms cubic-bezier(.16,.84,.24,1) both}
.aur-riga{transition:background 160ms ease}
.aur-riga:hover{background:rgba(255,255,255,0.07) !important}
.aur-btn{transition:background 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease}
/* la chart si apre sotto la riga come una tendina, dall'alto (senza l'effetto da sinistra delle righe) */
@keyframes aurTendina{from{opacity:0;transform:translateY(-22px) scaleY(.94)}to{opacity:1;transform:none}}
.aur-tendina{animation:aurTendina 560ms cubic-bezier(.16,.84,.24,1) both;transform-origin:top}
.aur-pannello{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.aur-scroll{overflow-x:visible}
@media (max-width: 1000px){.aur-pannello{grid-template-columns:minmax(0,1fr)}.aur-scroll{overflow-x:auto}}
@media (prefers-reduced-motion: reduce){.aur-riga-in,.aur-cella-in,.aur-tendina{animation:none}.aur-riga,.aur-btn{transition:none}}
</style>

</head>
<body>
<div id="app"></div>
<template id="modello">

              <sc-for list="{{modi}}" as="m"><button type="button" class="aur-btn" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.nome}}</button></sc-for>

          </div>

                    <span style="min-width: 0;"><span style="display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.nome}}</span><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #AEB7CC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.sotto}}</span></span>

            </div>
            <div style="{{zd.style}}">

              <div style="font-family: 'Instrument Serif', serif; font-size: 40px; line-height: 1; margin-top: 8px;">{{zd.nome}}</div>
              <div style="margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: rgba(4,6,13,0.12);">

                <div style="display: flex; gap: 16px; align-items: center; margin-top: 4px;">
                  <div style="font-family: 'Instrument Serif', serif; font-size: 44px; line-height: 1; white-space: nowrap;">{{zd.big}}<span style="font-size: 17px;">{{zd.bigU}}</span></div>
                  <div style="display: flex; flex-direction: column; gap: 2px;"><sc-for list="{{zd.righe}}" as="r"><div style="font-size: 13px; line-height: 1.4;">{{r.t}}</div></sc-for></div>

              <sc-if value="{{zd.haLista}}">

              </sc-if>
              <div style="margin-top: 12px; font-size: 12.5px; opacity: 0.85;">{{zd.lega}}</div>
            </div>
                    </div>
                  </div>
                </sc-if>
              </sc-for>
              <sc-if value="{{vuoto}}"><div style="padding: 28px; color: #AEB7CC;">Nessun giocatore con abbastanza giocate nelle week scelte.</div></sc-if>
            </div>
          </div>
          <p style="margin: 14px 0 0; font-size: 12.5px; color: #8F9BB8; line-height: 1.5;">{{legenda}}</p>
      </div>
    </sc-if>

    <footer style="margin-top: 70px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8F9BB8; text-align: center;">Statistiche della regular season, aggiornate dopo ogni week. Dati nflverse (CC-BY 4.0).</footer>
  </div>
</div>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const S = window.AUREUS_STATS;
    this.state = { scheda: 'giocatori', ruolo: 'QB', modo: 'stagione', weeks: S.weeks.slice(), ordina: null, cresc: false,
      tutti: false, aperto: null, zona: null, anima: true, tendina: false };
  }
  renderVals() {
    const S = window.AUREUS_STATS;
    const st = this.state;
    const glow = '#FFB27A';
    const SQ = S.squadre;
    const fmt = (x, d) => (x === null || x === undefined || !isFinite(x)) ? '–' : Number(x).toFixed(d === undefined ? 1 : d).replace('.', ',').replace('-', '−');
    const intero = (x) => (x === null || x === undefined || !isFinite(x)) ? '–' : Math.round(x).toLocaleString('it-IT');
    const pct = (x) => (x === null || x === undefined || !isFinite(x)) ? '–' : Math.round(x) + '%';
    const pill = (on, accento) => 'cursor: pointer; padding: 8px 14px; border-radius: 999px; font: inherit; ' + (on ? 'background: ' + (accento ? glow : '#FFFFFF') + '; color: #04060D; border: 1px solid transparent; font-weight: 600;' : 'background: transparent; color: #C9D0E2; border: 1px solid rgba(255,255,255,0.18);');
    const anima = st.anima;
    if (anima || st.tendina) setTimeout(() => { this.state.anima = false; this.state.tendina = false; }, 0);   // cascata e tendina solo quando cambiano
    const cambia = (o) => this.setState(Object.assign({ anima: true }, o));

    const schede = [['giocatori', 'Giocatori'], ['squadre', 'Squadre']].map(([k, n]) => ({ nome: n, on: String(st.scheda === k),
      pick: () => cambia({ scheda: k }), style: 'border: 0; cursor: pointer; padding: 10px 22px; border-radius: 999px; font: inherit; ' + (st.scheda === k ? 'background: #FFFFFF; color: #04060D; font-weight: 600;' : 'background: transparent; color: #C9D0E2;') }));
    const ruoli = ['QB', 'RB', 'WR', 'TE'].map((k) => ({ nome: k, on: String(st.ruolo === k), pick: () => cambia({ ruolo: k, ordina: null, cresc: false, aperto: null, zona: null }), style: pill(st.ruolo === k, true) }));
    const modi = [['stagione', 'Stagione'], ['partita', 'Per partita']].map(([k, n]) => ({ nome: n, on: String(st.modo === k), pick: () => cambia({ modo: k }),
      style: 'border: 0; cursor: pointer; padding: 7px 13px; border-radius: 999px; font: inherit; ' + (st.modo === k ? 'background: #FFFFFF; color: #04060D; font-weight: 600;' : 'background: transparent; color: #C9D0E2;') }));

    // week scelte: un solo filtro per classifica e chart (decisione di Federico, 10 novembre 2026), ripetuto dentro la
    // chart aperta; cambiato da li' la classifica si aggiorna senza rifare la cascata
    const W = st.weeks.slice().sort((a, b) => a - b);
    const tutteW = W.length === S.weeks.length;
    // filtro cambiato da dentro la chart (decisione di Federico, 10 novembre 2026): si segue il giocatore. Anche se la
    // classifica lo sposta, la pagina scorre fino alla sua riga (in alto sullo schermo) con la chart sotto; dal filtro in
    // alto, a chart chiusa, non si segue nessuno
    const segui = (casc, o) => {
      this.setState(o);
      const id = st.aperto; const r = (id && !casc) ? document.querySelector('[data-riga="' + id + '"]') : null;
      if (r) window.scrollBy(0, r.getBoundingClientRect().top - 70);
    };
    const chips = (casc) => S.weeks.map((w) => { const on = W.indexOf(w) >= 0; return { nome: String(w), on: String(on), aria: 'Week ' + w + (on ? ', inclusa' : ', esclusa'),
      pick: () => { let n = on ? W.filter((x) => x !== w) : W.concat([w]); if (!n.length) n = [w]; segui(casc, { weeks: n, anima: casc }); },
      style: 'cursor: pointer; min-width: 33px; padding: 6px 0; border-radius: 10px; font: inherit; ' + (on ? 'background: rgba(255,178,122,0.92); color: #1A0E08; border: 1px solid transparent; font-weight: 600;' : 'background: transparent; color: #8F9BB8; border: 1px solid rgba(255,255,255,0.16);') }; });
    const ult = (n) => S.weeks.slice(-n);
    const uguale = (a) => a.length === W.length && a.every((x) => W.indexOf(x) >= 0);
    const corte = (casc) => [['Tutte', S.weeks], ['Ultime 5', ult(5)], ['Ultime 3', ult(3)]].map(([n, a]) => ({ nome: n, pick: () => segui(casc, { weeks: a.slice(), anima: casc }),
      style: 'cursor: pointer; padding: 6px 12px; border-radius: 999px; font: inherit; ' + (uguale(a) ? 'background: #FFFFFF; color: #04060D; border: 1px solid transparent; font-weight: 600;' : 'background: transparent; color: #C9D0E2; border: 1px solid rgba(255,255,255,0.18);') }));

    const nelPeriodo = tutteW ? 'in tutta la stagione ' + S.stagione : (W.length === 1 ? 'nella week ' + W[0] : 'nelle week ' + intervalli(W));
    const periodoTxt = 'Classifica e chart ' + nelPeriodo + (tutteW ? ' (week ' + intervalli(W) + ')' : '') + (st.modo === 'partita' ? ', in media a partita giocata.' : ', in totale.');
    const sopra = 'STAGIONE ' + S.stagione + ' · REGULAR SEASON · WEEK ' + intervalli(S.weeks);
    // minimo di lanci, target o corse perche' una zona abbia colore e posto (punto 50): con 6 o piu' week 5 (3 nel
    // profondo), come le pagine partita; con meno week in proporzione, arrotondato, mai sotto 1
    const kW = Math.min(W.length, 6);
    const minZ = (prof) => Math.max(1, Math.round((prof === 'profondo' ? 3 : 5) * kW / 6));

    // somme del giocatore sulle week scelte
    const partiteSq = (t) => (S.partite[t] || []).filter((w) => W.indexOf(w) >= 0).length;
    const somma = (g) => {
      const s = {}; S.campi.forEach((c) => { s[c] = 0; }); s.rlng = null; s.clng = null; s.g = 0; s.team = null; let ultW = -1;
      W.forEach((w) => { const v = g.w[String(w)]; if (!v) return; s.g += 1;
        S.campi.forEach((c, i) => { const x = v[i]; if (x === null || x === undefined) return; if (c === 'rlng' || c === 'clng') s[c] = s[c] === null ? x : Math.max(s[c], x); else s[c] += x; });
        if (w > ultW) { ultW = w; s.team = v[S.campi.length]; } });
      return s;
    };
    const div = (a, b) => b ? a / b : null;
    // colonne per ruolo: c = quantita' (diventa media a partita con "Per partita"); asc = meglio basso
    const COL = {
      QB: [
        { k: 'pyds', n: 'Yard', tip: 'Yard lanciate', v: (s) => s.pyds, c: 1, d: 0 },

        const top = Object.keys(agg).sort((a, b) => agg[b][0] - agg[a][0] || agg[b][2] - agg[a][2]).slice(0, 3);

            { t: (qb ? pct(100 * z[2] / z[0]) + ' completi · ' : z[2] + ' ricezioni (' + pct(100 * z[2] / z[0]) + ') · ') + (z[2] ? fmt(z[1] / z[2]) : '–') + ' yard per ' + (qb ? 'completo' : 'ricezione') },
            { t: cosa(z[0]) + ' (' + pct(100 * z[0] / tot) + ' dei suoi) · ' + z[1] + ' yard · ' + z[3] + ' TD' + (qb ? ' · ' + z[4] + (z[4] === 1 ? ' intercetto' : ' intercetti') : '') }]
            : [{ t: qb ? 'nessun lancio in questa zona' : 'nessun target in questa zona' }],
          haLista: top.length ? 'true' : '', listaTit: qb ? 'CHI RICEVE DI PIÙ QUI' : 'CHI GLI LANCIA QUI',
          lista: top.map((id) => { const a = agg[id]; const rr = ruoloDi(id);
            return { nome: nomeDi(id) + (rr ? ' (' + rr + ')' : ''), t: '· ' + a[1] + (a[1] === 1 ? ' ricezione' : ' ricezioni') + ' su ' + a[0] + ' target · ' + a[2] + ' yard' + (a[3] ? ' · ' + a[3] + ' TD' : '') }; }),
          lega: 'Media della lega in questa zona: ' + fmt(x.ly) + (qb ? ' yard a lancio.' : ' yard per target.') };
      }
    }

    return {
